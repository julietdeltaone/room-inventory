<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #111113;
  --s1:       #18181b;
  --s2:       #1e1e22;
  --s3:       #242428;
  --s4:       #2a2a2f;
  --border:   #2c2c31;
  --border2:  #383840;

  --rose:     #b07a84;
  --rose-dim: rgba(176,122,132,0.14);
  --rose-glow:rgba(176,122,132,0.06);
  --steel:    #6e8fa8;
  --steel-dim:rgba(110,143,168,0.12);

  --text:     #e8e8ea;
  --text-mid: #909098;
  --text-dim: #565660;

  --green:    #4d8f6a;
  --red:      #8f4848;
  --amber:    #9e7a32;

  --score-green:  #4d8f6a;
  --score-yellow: #9e7a32;
  --score-orange: #8f5530;
  --score-red:    #8f3838;

  --radius:   6px;
  --font-mono: 'DM Mono', monospace;
  --font-sans: 'Inter', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── HEADER ── */
header {
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 200;
  gap: 12px;
}

.logo {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--rose);
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}

.header-center {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 340px;
}

.header-search {
  flex: 1;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 10px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  outline: none;
  transition: border-color 0.15s;
  min-width: 0;
}
.header-search:focus { border-color: var(--rose); }
.header-search::placeholder { color: var(--text-dim); }

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.sync-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.sync-pill:hover { border-color: var(--border2); color: var(--text-mid); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
.sync-dot.ok { background: var(--green); box-shadow: 0 0 5px rgba(77,143,106,0.7); }
.sync-dot.sync { background: var(--amber); box-shadow: 0 0 5px rgba(158,122,50,0.7); }
.sync-dot.err { background: var(--red); box-shadow: 0 0 5px rgba(143,72,72,0.7); }

.hdr-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
}

.btn-ghost {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--text-mid);
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 10px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: all 0.12s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--border2); background: var(--s2); }
.btn-ghost.rose { color: var(--rose); border-color: var(--rose-dim); }
.btn-ghost.rose:hover { background: var(--rose-glow); border-color: var(--rose); color: var(--rose); }

/* ── APP LAYOUT ── */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100vh - 46px);
}

/* ── SIDEBAR ── */
.sidebar {
  padding: 10px 8px;
  position: sticky;
  top: 46px;
  height: calc(100vh - 46px);
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-right: 1px solid var(--border);
}

main { padding: 12px 16px; overflow-y: auto; min-width: 0; }

.sb-section { margin-bottom: 4px; }

.sb-label {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 6px 6px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.filter-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 5px 8px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--text-mid);
  font-family: var(--font-sans);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: all 0.1s;
  margin-bottom: 1px;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.filter-btn:hover { background: var(--s2); color: var(--text); border-color: var(--border); }
.filter-btn.active { background: var(--rose-glow); color: var(--rose); border-color: var(--rose-dim); }
.filter-btn .count {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.filter-btn.active .count { color: var(--rose); opacity: 0.7; }
.filter-btn .cdot2 { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.loc-tree-search {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 8px;
  margin: 4px 0;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 10px;
  outline: none;
  transition: border-color 0.15s;
  display: block;
}
.loc-tree-search:focus { border-color: var(--rose); }
.loc-tree-search::placeholder { color: var(--text-dim); }

/* sidebar tree */
#tree ul { list-style: none; margin: 0; padding-left: 10px; }
#tree > ul { padding-left: 0; }
.tnode { margin-bottom: 1px; }
.trow {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 6px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  transition: all 0.1s;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-mid);
}
.trow:hover { background: var(--s2); color: var(--text); }
.trow.sel { background: var(--rose-glow); border-color: var(--rose-dim); color: var(--rose); }
.trow .caret {
  width: 16px; flex: none; text-align: center; color: var(--text-dim);
  font-size: 10px; cursor: pointer; border-radius: 3px; padding: 2px 0;
}
.trow .caret:hover { color: var(--rose); background: var(--s3); }
.trow .lchip { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.trow .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tcount { font-size: 9px; color: var(--text-dim); flex: none; }
.trow.sel .tcount { color: var(--rose); opacity: 0.8; }
.cbar { display: flex; height: 3px; border-radius: 2px; overflow: hidden; margin: 2px 0 1px 21px; background: rgba(255,255,255,0.06); }
.cbar i { display: block; height: 100%; }

/* ── INFO BAR ── */
.info-bar {
  display: flex;
  gap: 0;
  margin-bottom: 10px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.info-cluster {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  gap: 0;
  border-right: 1px solid var(--border);
}
.info-cluster:last-child { border-right: none; }
.info-cluster-center { flex: 1; padding: 10px 18px; min-width: 0; }
.info-cell {
  display: flex;
  flex-direction: column;
  min-width: 80px;
  padding: 0 10px;
}
.info-cell:first-child { padding-left: 0; }
.info-cell:last-child { padding-right: 0; }
.info-label {
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 3px;
  white-space: nowrap;
}
.info-val {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
  white-space: nowrap;
}
.info-sub {
  font-family: var(--font-sans);
  font-size: 9px;
  color: var(--text-dim);
  margin-top: 2px;
  white-space: nowrap;
}
.info-divider {
  width: 1px;
  height: 32px;
  background: var(--border);
  flex-shrink: 0;
}
.info-score-track {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 4px;
}
.info-score-track .score-dist { height: 100%; display: flex; gap: 2px; }
.score-dist-seg { height: 100%; border-radius: 2px; min-width: 0; }
.info-band-labels {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 500;
  gap: 6px;
  overflow: hidden;
}

/* ── TOOLBAR ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.toolbar .sp { flex: 1; }
.tbl-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.locchip {
  display: none;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--rose-glow);
  border: 1px solid var(--rose-dim);
  color: var(--rose);
  border-radius: 20px;
  padding: 4px 6px 4px 10px;
}
.locchip.show { display: inline-flex; }
.locchip .x {
  background: none; border: none; color: var(--text-dim);
  font-size: 12px; cursor: pointer; padding: 1px 5px; border-radius: 4px;
  font-family: var(--font-mono);
}
.locchip .x:hover { color: var(--rose); background: var(--s3); }

/* ── TABLE ── */
.table-wrap {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  overflow-x: auto;
  background: var(--bg);
}
table { width: 100%; border-collapse: collapse; min-width: 900px; table-layout: auto; }
thead tr { background: var(--s1); border-bottom: 1px solid var(--border); }
th {
  padding: 7px 8px;
  text-align: left;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  color: var(--text-dim);
  white-space: nowrap;
  user-select: none;
}
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--text-mid); }
th.sorted { color: var(--rose); }
th .arr { color: var(--rose); font-size: 10px; }

tbody tr { border-bottom: 1px solid var(--border); transition: background 0.08s; cursor: pointer; border-left: 3px solid transparent; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--s1); }

td { padding: 6px 8px; vertical-align: middle; font-size: 12px; }
td.nm { font-weight: 600; color: var(--text); }
td.nm .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

.loc-path { font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); }
.loc-path-sep { color: var(--text-dim); margin: 0 2px; font-size: 9px; }
.loc-path-leaf { color: var(--text); }
.qtyv { font-family: var(--font-mono); color: var(--text-mid); }

/* pills + badges */
.cat-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.pill {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.04em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.pill.g { background: rgba(77,143,106,0.14); color: #6fae83; border-color: rgba(77,143,106,0.25); }
.pill.s { background: var(--steel-dim); color: var(--steel); border-color: rgba(110,143,168,0.25); }
.pill.a { background: rgba(158,122,50,0.14); color: #c09a4a; border-color: rgba(158,122,50,0.25); }
.pill.o { background: rgba(143,85,48,0.14); color: #c07f4e; border-color: rgba(143,85,48,0.25); }
.pill.r { background: rgba(143,72,72,0.14); color: #c07a7a; border-color: rgba(143,72,72,0.25); }
.pill.d { background: rgba(255,255,255,0.05); color: var(--text-dim); border-color: var(--border); }
.pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

.empty { padding: 28px; text-align: center; color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }

/* ── EDITOR MODAL ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: flex-start; justify-content: center;
  z-index: 500; padding: 16px; overflow-y: auto;
}
.overlay.open { display: flex; }
.modal {
  background: var(--s1);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  width: 100%; max-width: 600px;
  margin: 24px 0; padding: 18px;
  max-height: calc(100vh - 80px); overflow-y: auto;
}
.modal h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--text-mid); font-family: var(--font-sans); }
label.f input, label.f select, label.f textarea {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: var(--font-sans);
  width: 100%;
  outline: none;
}
label.f textarea { min-height: 64px; resize: vertical; font-family: var(--font-sans); }
label.f input:focus, label.f select:focus, label.f textarea:focus { border-color: var(--rose); }
label.f select option { background: var(--s2); }
.grid div.f { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--text-mid); font-family: var(--font-sans); }
.rowchk { flex-direction: row !important; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
.rowchk input { width: 15px; height: 15px; accent-color: var(--rose); }
.btns { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-sans);
}
.btn.save { background: var(--rose); border-color: var(--rose); color: #141114; }
.btn.save:hover { filter: brightness(1.1); }
.btn.cancel { background: var(--s2); color: var(--text); }
.btn.cancel:hover { border-color: var(--border2); }
.btn.del { background: none; color: var(--red); border: 1px solid var(--red); flex: 0 0 auto; padding: 10px 16px; }
.btn.del:hover { background: rgba(143,72,72,0.12); }
.req { color: var(--rose); }

/* name autocomplete suggestions (legacy quick-add behavior) */
.suggest-wrap { position: relative; }
.suggest {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 30;
  background: var(--s2); border: 1px solid var(--border2); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  max-height: 180px; overflow-y: auto; margin-top: -3px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.5);
}
.suggest-item {
  padding: 8px 10px; font-size: 13px; color: var(--text);
  cursor: pointer; font-family: var(--font-sans);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.suggest-item:hover, .suggest-item.active { background: var(--s3); color: var(--rose); }

/* qty stepper */
.flabel { font-size: 11px; color: var(--text-mid); font-family: var(--font-sans); }
.stepper { display: flex; gap: 6px; align-items: stretch; }
.stepper input {
  flex: 1; min-width: 0; text-align: center;
  background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); padding: 8px 10px; font-size: 13px; font-family: var(--font-sans); outline: none;
}
.stepper input:focus { border-color: var(--rose); }
.stepbtn {
  flex: 0 0 40px; background: var(--s2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text-mid); font-size: 17px; line-height: 1;
  cursor: pointer; font-family: var(--font-sans);
}
.stepbtn:hover { color: var(--rose); border-color: var(--rose-dim); }
.stepbtn:active { background: var(--s3); }

/* change history (read-only, from change_log) */
.hist-label {
  font-family: var(--font-sans); font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
}
#edHistory {
  background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 6px 10px; max-height: 120px; overflow-y: auto;
}
.hist-entry { font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); padding: 3px 0; border-bottom: 1px solid var(--border); }
.hist-entry:last-child { border-bottom: none; }
.hist-entry .hf { color: var(--rose); margin-right: 6px; }
.hist-entry .ht { color: var(--text-dim); }

/* editor status line + extra buttons */
.ed-status { min-height: 18px; font-family: var(--font-mono); font-size: 11px; color: var(--green); margin: 10px 0 0; }
.btns { flex-wrap: wrap; }
.btn.another { background: var(--s3); color: var(--text); }
.btn.another:hover { border-color: var(--border2); }
.btn.dup { background: none; color: var(--steel); border: 1px solid var(--steel); flex: 0 0 auto; padding: 10px 16px; }
.btn.dup:hover { background: var(--steel-dim); }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--rose); outline-offset: 1px;
}

/* sidebar toggle (mobile) */
.sb-toggle { display: none; }

/* ── RESPONSIVE ── */
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: static; height: auto; max-height: 45vh;
    border-right: none; border-bottom: 1px solid var(--border);
    display: none;
  }
  .sidebar.open { display: flex; }
  .sb-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--text-mid); background: var(--s2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 12px; cursor: pointer; margin-bottom: 8px;
  }
  .sb-toggle:hover { color: var(--rose); border-color: var(--rose-dim); }
  .info-cluster-center { display: none; }
  .header-center { max-width: none; }
  .hdr-count { display: none; }
}
@media (max-width: 640px) {
  thead { display: none; }
  table { min-width: 0; }
  tbody tr { display: block; border: 1px solid var(--border); border-radius: var(--radius); margin: 8px; background: var(--s1); border-left: 3px solid var(--catc, transparent); }
  tbody td { display: flex; align-items: center; gap: 10px; border: none; padding: 6px 12px; }
  tbody td::before {
    content: attr(data-l); font-family: var(--font-sans); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
    min-width: 78px; flex: none;
  }
  tbody td.nmcell { padding-top: 10px; }
  tbody td.nmcell::before { display: none; }
  tbody td:last-child { padding-bottom: 10px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Inventory</div>
  <div class="header-center">
    <input class="header-search" id="search" type="search" placeholder="search items…" autocomplete="off">
  </div>
  <div class="header-right">
    <span class="sync-pill" id="syncBadge" title="Tap to retry sync">
      <span class="sync-dot" id="syncDot"></span><span id="syncText">loading</span>
    </span>
    <span class="hdr-count" id="itemCount"></span>
    <a class="btn-ghost" href="locate.html">Locate →</a>
  </div>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-section">
      <div class="sb-label"><span>Location</span></div>
      <button class="filter-btn active" id="locAllBtn"><span>All</span><span class="count" id="cntLocAll">0</span></button>
      <input class="loc-tree-search" id="treeFilter" placeholder="filter locations…" autocomplete="off">
      <div id="tree"></div>
    </div>

    <div class="sb-section" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
      <div class="sb-label"><span>View</span></div>
      <button class="filter-btn active" data-view="all"><span>All Items</span><span class="count" id="cntViewAll">0</span></button>
      <button class="filter-btn" data-view="inuse"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span>In Use</span><span class="count" id="cntInUse">0</span></button>
      <button class="filter-btn" data-view="hasdigital"><span style="color:var(--steel)">Has Digital Copy</span><span class="count" id="cntHasDigital">0</span></button>
      <button class="filter-btn" data-view="nodigital"><span style="color:var(--steel)">No Digital Copy</span><span class="count" id="cntNoDigital">0</span></button>
    </div>

    <div class="sb-section" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
      <div class="sb-label"><span>Fill Status</span></div>
      <button class="filter-btn active" data-fill="all"><span>All</span><span class="count" id="cntFillAll">0</span></button>
      <button class="filter-btn" data-fill="Full"><span style="color:var(--green)">Full</span><span class="count" id="cntFillFull">0</span></button>
      <button class="filter-btn" data-fill="Most"><span style="color:#7a9e64">Most</span><span class="count" id="cntFillMost">0</span></button>
      <button class="filter-btn" data-fill="Half"><span style="color:var(--amber)">Half</span><span class="count" id="cntFillHalf">0</span></button>
      <button class="filter-btn" data-fill="Low"><span style="color:var(--score-orange)">Low</span><span class="count" id="cntFillLow">0</span></button>
      <button class="filter-btn" data-fill="Empty"><span style="color:var(--score-red)">Empty</span><span class="count" id="cntFillEmpty">0</span></button>
      <button class="filter-btn" data-fill="set"><span style="color:var(--text-dim)">Has Fill</span><span class="count" id="cntFillSet">0</span></button>
    </div>

    <div class="sb-section" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
      <div class="sb-label"><span>Category</span></div>
      <button class="filter-btn active" data-cat="all"><span>All</span><span class="count" id="cntCatAll">0</span></button>
      <div id="catFilters"></div>
    </div>
  </aside>

  <main>
    <button class="sb-toggle" id="sbToggle">☰ Filters</button>

    <div class="info-bar">
      <div class="info-cluster">
        <div class="info-cell">
          <div class="info-label">Items</div>
          <div class="info-val" style="color:var(--rose)" id="statTotal">—</div>
        </div>
        <div class="info-divider"></div>
        <div class="info-cell">
          <div class="info-label">Est. Value</div>
          <div class="info-val" style="color:var(--green)" id="statValue">—</div>
          <div class="info-sub" id="statValueSub"></div>
        </div>
        <div class="info-divider"></div>
        <div class="info-cell">
          <div class="info-label">If Sold (40–60%)</div>
          <div class="info-val" style="color:var(--amber)" id="statSell">—</div>
          <div class="info-sub">estimated resale range</div>
        </div>
      </div>

      <div class="info-cluster info-cluster-center">
        <div class="info-cell" style="width:100%">
          <div class="info-label" style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span>Condition Distribution</span>
          </div>
          <div class="info-score-track"><div class="score-dist" id="condBar"></div></div>
          <div class="info-band-labels" id="condLabels"></div>
        </div>
      </div>

      <div class="info-cluster">
        <div class="info-cell">
          <div class="info-label">Completeness</div>
          <div class="info-val" id="statComplete">—</div>
          <div class="info-sub" id="statCompleteSub"></div>
        </div>
        <div class="info-divider"></div>
        <div class="info-cell">
          <div class="info-label">No Digital Copy</div>
          <div class="info-val" style="color:var(--steel)" id="statNoDigital">—</div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <span class="tbl-label">Table</span>
      <span class="locchip" id="locChip"><span id="locChipPath"></span><button class="x" id="locChipX" aria-label="Clear location filter">✕</button></span>
      <span class="sp"></span>
      <button class="btn-ghost rose" id="addBtn">+ Quick Add</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" hidden>No items match.</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <h2 id="edTitle">Add Item</h2>
    <div class="grid">
      <label class="f full suggest-wrap">Item Name <span class="req">*</span><input id="ed_name" maxlength="200" autocomplete="off"><span class="suggest" id="ed_suggest" hidden></span></label>
      <label class="f full">Location<input id="ed_location" list="locList" placeholder="Bedroom > Shelf…">
        <datalist id="locList"></datalist></label>
      <label class="f">Category<select id="ed_category"></select></label>
      <div class="f"><span class="flabel">Qty</span><span class="stepper"><button type="button" class="stepbtn" id="qtyMinus" aria-label="Decrease quantity">−</button><input id="ed_qty" value="1" inputmode="numeric"><button type="button" class="stepbtn" id="qtyPlus" aria-label="Increase quantity">+</button></span></div>
      <label class="f">Condition<select id="ed_condition"></select></label>
      <label class="f">Keep<select id="ed_keep"></select></label>
      <label class="f">Frequency<select id="ed_frequency"></select></label>
      <label class="f">Criticality<select id="ed_criticality"></select></label>
      <label class="f">Replaceability<select id="ed_replaceability"></select></label>
      <label class="f">Fill Level<select id="ed_fill_level"></select></label>
      <label class="f">Serial / Ref #<input id="ed_sn" maxlength="120"></label>
      <label class="f">Doc Type<input id="ed_doc_type" maxlength="120"></label>
      <label class="f">Year Purchased<input id="ed_year_purchased" maxlength="10" inputmode="numeric" placeholder="2024"></label>
      <label class="f">Last Used<input id="ed_last_used" maxlength="40" placeholder="2026-09"></label>
      <label class="f">Est. Value $<input id="ed_est_value" inputmode="decimal" placeholder="25"></label>
      <label class="f full">Keywords<input id="ed_keywords" maxlength="300" placeholder="comma-separated tags"></label>
      <label class="f full">Notes<textarea id="ed_notes" maxlength="2000"></textarea></label>
      <label class="f rowchk"><input type="checkbox" id="ed_in_use"> In Use</label>
      <label class="f rowchk"><input type="checkbox" id="ed_digital_copy"> Digital Copy</label>
      <div class="full" id="edHistoryWrap" hidden>
        <div class="hist-label">Change history</div>
        <div id="edHistory"></div>
      </div>
    </div>
    <div class="ed-status" id="edStatus" aria-live="polite"></div>
    <div class="btns">
      <button class="btn del" id="edDelete" hidden>Delete</button>
      <button class="btn dup" id="edDupe" hidden>Duplicate</button>
      <button class="btn cancel" id="edCancel">Cancel</button>
      <button class="btn another" id="edSaveAnother">Add Another</button>
      <button class="btn save" id="edSave">Save</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   DEPLOY-TIME CONFIG — the ONLY thing to change when deploying.
   Paste the Apps Script web app /exec URL between the quotes.
   ═══════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyH0hgBBMiM-D64AEC4S90T4aWDvL7BPtQGXLY50DltWIGOqHTy3Yvkgf-gegPuAWKZ/exec';

const CACHE_KEY = 'inv_v3_cache';

/* ---------- color system ---------- */
/* hand-tuned category colors (dark-mode friendly, distinct) */
var CAT_COLORS = {
  'Clothing':'#5aa9ff','Memorabilia & Keepsakes':'#c78bff','Cables & Charging':'#ffd166',
  'Electronics':'#4dd0e1','Accessories':'#ff8a65','Personal Care & Grooming':'#80cbc4',
  'Office Supplies':'#aed581','Tools & Hardware':'#ffab40','Camera/Photo Gear':'#f06292',
  'Legal Documents':'#90a4ae','Identity Documents':'#b0bec5','Automotive':'#ef5350',
  'Financial Documents':'#66bb6a','Cleaning & Home':'#26c6da','Health & Supplements':'#ab47bc',
  'Footwear':'#8d6e63','Books & Notebooks':'#d4e157','Gym & Fitness':'#26a69a',
  'Misc':'#9e9e9e','Military':'#7cb342','Firearms & Ammo':'#ff5252','Bags & Carry':'#5c6bc0',
  'Military Documents':'#78909c','Vehicle Documents':'#ffa726','Furniture':'#a1887f'
};
function catColor(c){
  c = String(c == null ? '' : c);
  if(CAT_COLORS[c]) return CAT_COLORS[c];
  if(!c) return '#6b7280';
  var h = 0;
  for(var i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) % 360;
  return 'hsl(' + h + ',60%,62%)';
}
/* top-level location colors */
var LOC_COLORS = {
  'Bedroom':'#5aa9ff','Basement':'#b088ff','Hallway':'#ffd166','Tesla':'#ff6b6b',
  'Barn':'#ffa94d','SUNY Potsdam (Maxcy)':'#4dd0e1','Unassigned':'#9aa0ae',
  'Clarkson':'#7ee081','(no location)':'#6b7280'
};
function locColor(path){
  var top = String(path == null ? '' : path).split(' > ')[0] || '(no location)';
  return LOC_COLORS[top] || '#6b7280';
}

/* ---------- small helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function num(v){
  var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
function money(v){
  var n = num(v);
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits: n % 1 ? 2 : 0});
}
function locKey(it){
  var l = String(it.location || '').trim();
  return l || '(no location)';
}
function isTrue(v){ return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1'; }

/* ---------- state ---------- */
var items = [];            // full item list (snake_case fields from API)
var pending = [];          // ops that failed to reach the API: retried on tap of sync badge
var editingId = null;      // id of item open in editor (null = new)
var sortKey = 'name', sortDir = 1;
var tree = null;
var expanded = {};         // path -> true
var locFilter = null;      // path string filtering the table (subtree), or null
var viewFilter = 'all';    // all | inuse | hasdigital | nodigital
var fillFilter = 'all';    // all | Full | Most | Half | Low | Empty | set
var catFilter = 'all';      // all | category name
var treeQuery = '';        // sidebar tree text filter

var COLUMNS = [
  {key:'name',         label:'Name'},
  {key:'location',     label:'Location'},
  {key:'qty',          label:'Qty'},
  {key:'category',     label:'Category'},
  {key:'frequency',    label:'Freq'},
  {key:'criticality',  label:'Criticality'},
  {key:'condition',    label:'Condition'},
  {key:'keep',         label:'Keep'},
  {key:'est_value',    label:'Est. $'}
];
var SORTABLE = { name:1, qty:1, est_value:1 };

/* option presets; merged with values actually present in the data so an
   edit never wipes a value the preset list doesn't know about */
var PRESETS = {
  condition:      ['New','Good','Fair','Poor'],
  keep:           ['Keep','Maybe','Sell','Donate','Trash'],
  frequency:      ['Daily','Weekly','Monthly','Quarterly','Annually','Rarely','Never'],
  criticality:    ['Essential','Important','Nice to Have','Redundant'],
  replaceability: ['Irreplaceable','Hard','Expensive','Moderate','Easy','Cheap','Hard/Expensive','Easy/Cheap'],
  fill_level:     ['Full','Most','Half','Low','Empty']
};
function optionsFor(field){
  var seen = {}, out = [];
  (PRESETS[field] || []).concat(items.map(function(i){ return i[field]; })).forEach(function(v){
    v = String(v == null ? '' : v);
    if(!v || seen[v]) return;
    seen[v] = 1; out.push(v);
  });
  return out;
}

/* ---------- sync indicator ---------- */
function setSync(state){
  var dot = $('syncDot'), txt = $('syncText');
  dot.className = 'sync-dot ' + (state === 'ok' ? 'ok' : state === 'sync' ? 'sync' : 'err');
  txt.textContent = state === 'ok' ? 'synced'
    : state === 'sync' ? 'syncing…'
    : 'offline' + (pending.length ? ' (' + pending.length + ' pending — tap to retry)' : ' — tap to retry');
}

/* ---------- API ---------- */
function fetchWithTimeout(url, opts, ms){
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 20000);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal})).then(
    function(res){
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res;
    },
    function(err){ clearTimeout(timer); throw err; }
  );
}
async function apiPost(body){
  var res = await fetchWithTimeout(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(body)
  }, 25000);
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || 'API error');
  return j;
}

function persist(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch(e){}
}

async function load(){
  setSync('sync');
  var j = null;
  for(var a = 0; a < 2 && !j; a++){   // one automatic retry before falling back to cache
    try{
      var r = await fetchWithTimeout(API_URL + '?action=list', null, 20000);
      var d = await r.json();
      if(d && d.ok) j = d;
    }catch(e){ j = null; }
  }
  if(j){
    items = j.items || [];
    persist();
    setSync(pending.length ? 'err' : 'ok');
    if(pending.length) flushPending();
  }else{
    try { items = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch(_){ items = []; }
    setSync('err');
  }
  tree = buildTree(items);
  buildFilterOptions();
  renderTree();
  render();
  // ?add=1 deep link (from the Locate tab bar): open the add-item editor
  if(new URLSearchParams(location.search).get('add') === '1'){
    history.replaceState(null, '', location.pathname);
    openEditor(null);
  }
}

async function flushPending(){
  if(!pending.length) return;
  setSync('sync');
  var queue = pending.slice(); pending = [];
  for(var k = 0; k < queue.length; k++){
    var op = queue[k];
    try{
      if(op.t === 'upsert'){
        var body = Object.assign({}, op.item);
        var wasNew = op.isNew;
        if(wasNew) delete body.id;
        var r = await apiPost({action:'upsert', items:[body]});
        if(wasNew && r.ids && r.ids[0] != null){
          var local = items.find(function(i){ return i.id === op.item.id; });
          if(local) local.id = r.ids[0];
        }
      }else if(op.t === 'delete'){
        if(typeof op.ids[0] === 'number') await apiPost({action:'delete', ids:op.ids});
      }else if(op.t === 'patch'){
        await apiPost({action:'patch', id:op.id, fields:op.fields});
      }
    }catch(e){ pending.push(op); }
  }
  tree = buildTree(items);
  persist(); renderTree(); render();
  setSync(pending.length ? 'err' : 'ok');
}

/* ---------- location tree ---------- */
function buildTree(list){
  var root = {name:'', children:{}, items:[], total:0, catCounts:{}};
  list.forEach(function(it){
    var loc = String(it.location || '').trim();
    var parts = loc ? loc.split(' > ') : ['(no location)'];
    var node = root;
    node.total++;
    bumpCat(node, it);
    parts.forEach(function(p){
      if(!node.children[p]) node.children[p] = {name:p, children:{}, items:[], total:0, catCounts:{}, path:''};
      node = node.children[p];
      node.total++;
      bumpCat(node, it);
    });
    node.items.push(it);
  });
  (function walk(n, prefix){
    Object.keys(n.children).forEach(function(k){
      var c = n.children[k];
      c.path = prefix ? prefix + ' > ' + k : k;
      walk(c, c.path);
    });
  })(root, '');
  return root;
}
function bumpCat(node, it){
  var c = String(it.category || '') || '(none)';
  node.catCounts[c] = (node.catCounts[c] || 0) + 1;
}
function catBarHtml(catCounts, total){
  var keys = Object.keys(catCounts).sort(function(a,b){ return catCounts[b] - catCounts[a]; });
  var segs = keys.slice(0, 8).map(function(k){
    var w = Math.max(3, Math.round(catCounts[k] / total * 100));
    return '<i style="width:' + w + '%;background:' + catColor(k) + '" title="' + esc(k) + ' ' + catCounts[k] + '"></i>';
  }).join('');
  return '<span class="cbar">' + segs + '</span>';
}

function renderTree(){
  var el = $('tree');
  if(!tree){ el.innerHTML = '<div class="empty">No locations.</div>'; return; }
  var q = treeQuery.trim().toLowerCase();
  function nodeMatches(n){
    if(!q) return true;
    if(n.name.toLowerCase().indexOf(q) !== -1) return true;
    return Object.keys(n.children).some(function(k){ return nodeMatches(n.children[k]); });
  }
  function nodeHtml(n, branch){
    var keys = Object.keys(n.children).sort();
    if(!keys.length) return '';
    return '<ul>' + keys.map(function(k){
      var c = n.children[k];
      if(!nodeMatches(c)) return '';
      var bcol = branch || locColor(c.path);   // whole branch keeps the root's color
      var has = Object.keys(c.children).length > 0;
      var open = q ? true : !!expanded[c.path];
      var caret = has
        ? '<span class="caret" tabindex="0" role="button" aria-label="Expand or collapse ' + esc(c.name) + '" data-caret="' + esc(c.path) + '">' + (open ? '▾' : '▸') + '</span>'
        : '<span class="caret"></span>';
      var sel = locFilter === c.path ? ' sel' : '';
      var html = '<li class="tnode"><div class="trow' + sel + '" data-path="' + esc(c.path) + '"' +
        ' tabindex="0" role="button" title="Tap to filter · tap again to clear"' +
        ' style="border-left-color:' + bcol + '55">' +
        caret + '<span class="lchip" style="background:' + bcol + '"></span>' +
        '<span class="tname">' + esc(c.name) + '</span>' +
        '<span class="tcount">' + c.total + '</span></div>' +
        catBarHtml(c.catCounts, c.total);
      if(open) html += nodeHtml(c, bcol);
      return html + '</li>';
    }).join('') + '</ul>';
  }
  el.innerHTML = nodeHtml(tree, null) || '<div class="empty">No locations.</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-caret]'), function(sp){
    var tog = function(e){
      if(e){ e.stopPropagation(); e.preventDefault(); }
      var p = sp.getAttribute('data-caret');
      expanded[p] = !expanded[p];
      renderTree();
    };
    sp.addEventListener('click', tog);
    sp.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ tog(e); }
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll('.trow'), function(row){
    var go = function(){
      var p = row.getAttribute('data-path');
      var turningOn = locFilter !== p;
      locFilter = turningOn ? p : null;   // tap again to clear
      $('locAllBtn').classList.toggle('active', !locFilter);
      paintLocChip();
      renderTree();
      render();
    };
    row.addEventListener('click', go);
    row.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    });
  });
}
function paintLocChip(){
  var chip = $('locChip');
  if(locFilter){
    chip.classList.add('show');
    $('locChipPath').innerHTML = locFilter.split(' > ').map(esc).join('<span style="color:var(--text-dim)"> › </span>');
  }else{
    chip.classList.remove('show');
  }
}

/* ---------- filtering / sorting / rendering ---------- */
function filtered(){
  var q = $('search').value.trim().toLowerCase();
  return items.filter(function(i){
    if(catFilter !== 'all' && String(i.category || '') !== catFilter) return false;
    if(viewFilter === 'inuse' && !isTrue(i.in_use)) return false;
    if(viewFilter === 'hasdigital' && !isTrue(i.digital_copy)) return false;
    if(viewFilter === 'nodigital' && isTrue(i.digital_copy)) return false;
    if(fillFilter === 'set'){ if(!String(i.fill_level || '').trim()) return false; }
    else if(fillFilter !== 'all' && String(i.fill_level || '') !== fillFilter) return false;
    if(locFilter){
      var lk = locKey(i);
      if(!(lk === locFilter || lk.indexOf(locFilter + ' > ') === 0)) return false;
    }
    if(q){
      var hay = [i.name, i.notes, i.sn, i.location, i.category, i.keywords].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(a, b){
    var va = a[sortKey], vb = b[sortKey];
    if(sortKey === 'est_value' || sortKey === 'qty'){ va = num(va); vb = num(vb); }
    else { va = String(va == null ? '' : va).toLowerCase(); vb = String(vb == null ? '' : vb).toLowerCase(); }
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
  });
}

function renderHead(){
  $('theadRow').innerHTML = COLUMNS.map(function(c){
    var sortable = SORTABLE[c.key];
    var cls = sortable ? 'sortable' : '';
    var arr = '';
    if(c.key === sortKey){ cls += ' sorted'; arr = ' <span class="arr">' + (sortDir === 1 ? '▲' : '▼') + '</span>'; }
    return '<th class="' + cls + '" data-k="' + c.key + '">' + esc(c.label) + arr + '</th>';
  }).join('');
  Array.prototype.forEach.call($('theadRow').children, function(th){
    var k = th.getAttribute('data-k');
    if(!SORTABLE[k]) return;
    th.addEventListener('click', function(){
      if(sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
      render();
    });
  });
}

/* pill + badge builders (legacy look, v3 data) */
function catBadge(cat){
  var c = String(cat || '');
  var col = catColor(c);
  return '<span class="cat-badge" style="background:' + col + '22;color:' + col +
    ';border:1px solid ' + col + '44">' + esc(c || '—') + '</span>';
}
function freqPill(f){
  f = String(f || '');
  var cls = f === 'Daily' ? 'g' : f === 'Weekly' ? 's' : (f === 'Monthly' || f === 'Quarterly') ? 'a'
    : (f === 'Rarely' || f === 'Annually') ? 'a' : 'd';
  return '<span class="pill ' + cls + '">' + esc(f || '—') + '</span>';
}
function critPill(c){
  c = String(c || '');
  var cls = c === 'Essential' ? 'g' : c === 'Important' ? 's' : c === 'Nice to Have' ? 'a' : 'd';
  return '<span class="pill ' + cls + '">' + esc(c || '—') + '</span>';
}
function condPill(c){
  c = String(c || '');
  var dot = c === 'New' ? 'var(--green)' : c === 'Good' ? 'var(--steel)'
    : c === 'Fair' ? 'var(--amber)' : c === 'Poor' ? 'var(--red)' : 'var(--text-dim)';
  var cls = c === 'New' ? 'g' : c === 'Good' ? 's' : c === 'Fair' ? 'a' : c === 'Poor' ? 'r' : 'd';
  return '<span class="pill ' + cls + '"><span class="dot" style="background:' + dot + '"></span>' + esc(c || '—') + '</span>';
}
function keepPill(k){
  k = String(k || '');
  var cls = k === 'Keep' ? 'g' : (k === 'Maybe' || k === 'Sell') ? 'a' : k ? 'o' : 'd';
  return '<span class="pill ' + cls + '">' + esc(k || '—') + '</span>';
}

function locCrumbs(loc){
  var parts = String(loc || '').split(' > ').filter(function(p){ return p; });
  if(!parts.length) return '<span class="loc-path">—</span>';
  return '<span class="loc-path">' + parts.map(function(p, idx){
    return '<span class="' + (idx === parts.length - 1 ? 'loc-path-leaf' : '') + '">' + esc(p) + '</span>';
  }).join('<span class="loc-path-sep">›</span>') + '</span>';
}

var COMPLETENESS_FIELDS = ['location','category','condition','est_value','notes','year_purchased','last_used','sn','doc_type','keywords'];

function render(){
  renderHead();
  var rows = filtered();
  $('itemCount').textContent = rows.length + ' of ' + items.length;
  $('emptyMsg').hidden = rows.length > 0;

  // ---- stats over the FULL list ----
  var tot = 0, priced = 0, inuse = 0, nodig = 0;
  var condCounts = { New: 0, Good: 0, Fair: 0, Poor: 0 };
  var fillTotal = 0, fillSeen = 0;
  var fills = { Full: 0, Most: 0, Half: 0, Low: 0, Empty: 0, set: 0 };
  var cats = {};
  var views = { inuse: 0, hasdigital: 0, nodigital: 0 };
  items.forEach(function(i){
    var v = num(i.est_value);
    tot += v; if(v > 0) priced++;
    if(isTrue(i.in_use)){ inuse++; views.inuse++; }
    if(isTrue(i.digital_copy)) views.hasdigital++; else { nodig++; views.nodigital++; }
    var cc = String(i.condition || '');
    if(condCounts[cc] !== undefined) condCounts[cc]++;
    var fl = String(i.fill_level || '');
    if(fl){ fills.set++; if(fills[fl] !== undefined) fills[fl]++; }
    var c = String(i.category || '') || '(none)';
    cats[c] = (cats[c] || 0) + 1;
    COMPLETENESS_FIELDS.forEach(function(f){
      fillTotal++;
      if(String(i[f] == null ? '' : i[f]).trim() !== '') fillSeen++;
    });
  });

  $('statTotal').textContent = items.length.toLocaleString('en-US');
  $('statValue').textContent = money(tot);
  $('statValueSub').textContent = priced + ' of ' + items.length + ' priced';
  $('statSell').textContent = money(tot * 0.4) + ' – ' + money(tot * 0.6);
  var pct = fillTotal ? Math.round(fillSeen / fillTotal * 100) : 0;
  $('statComplete').textContent = pct + '%';
  $('statCompleteSub').textContent = (fillTotal - fillSeen) + ' missing fields';
  $('statNoDigital').textContent = nodig.toLocaleString('en-US');

  // condition distribution bar
  var condOrder = [['New','var(--score-green)'],['Good','var(--score-yellow)'],['Fair','var(--score-orange)'],['Poor','var(--score-red)']];
  var condTot = condOrder.reduce(function(s, e){ return s + condCounts[e[0]]; }, 0) || 1;
  $('condBar').innerHTML = condOrder.map(function(e){
    var w = Math.max(condCounts[e[0]] ? 2 : 0, Math.round(condCounts[e[0]] / condTot * 100));
    return '<span class="score-dist-seg" style="width:' + w + '%;background:' + e[1] + '" title="' + e[0] + ' ' + condCounts[e[0]] + '"></span>';
  }).join('');
  $('condLabels').innerHTML = condOrder.map(function(e){
    return '<span style="color:' + e[1] + '">' + e[0] + ' ' + condCounts[e[0]] + '</span>';
  }).join('');

  // ---- sidebar counts ----
  $('cntLocAll').textContent = items.length;
  $('cntViewAll').textContent = items.length;
  $('cntInUse').textContent = views.inuse;
  $('cntHasDigital').textContent = views.hasdigital;
  $('cntNoDigital').textContent = views.nodigital;
  $('cntFillAll').textContent = items.length;
  $('cntFillFull').textContent = fills.Full;
  $('cntFillMost').textContent = fills.Most;
  $('cntFillHalf').textContent = fills.Half;
  $('cntFillLow').textContent = fills.Low;
  $('cntFillEmpty').textContent = fills.Empty;
  $('cntFillSet').textContent = fills.set;
  $('cntCatAll').textContent = items.length;

  // ---- table ----
  $('tbody').innerHTML = rows.map(function(i){
    var cc = catColor(i.category);
    return '<tr data-id="' + esc(String(i.id)) + '"' +
      ' style="--catc:' + cc + '" title="' + esc(i.location || '') + '">' +
      '<td class="nmcell nm" data-l="Name"><span class="cdot" style="background:' + cc + '"></span>' + esc(i.name || '(unnamed)') + '</td>' +
      '<td data-l="Location">' + locCrumbs(i.location) + '</td>' +
      '<td data-l="Qty" class="qtyv">' + esc(i.qty || '') + '</td>' +
      '<td data-l="Category">' + catBadge(i.category) + '</td>' +
      '<td data-l="Freq">' + freqPill(i.frequency) + '</td>' +
      '<td data-l="Criticality">' + critPill(i.criticality) + '</td>' +
      '<td data-l="Condition">' + condPill(i.condition) + '</td>' +
      '<td data-l="Keep">' + keepPill(i.keep) + '</td>' +
      '<td data-l="Est. $" class="qtyv">' + (num(i.est_value) ? esc(money(i.est_value)) : '—') + '</td>' +
    '</tr>';
  }).join('');
  Array.prototype.forEach.call($('tbody').children, function(tr){
    tr.addEventListener('click', function(){
      var id = tr.getAttribute('data-id');
      var it = items.find(function(x){ return String(x.id) === id; });
      if(it) openEditor(it);
    });
  });
}

function buildFilterOptions(){
  var cats = {}, i;
  items.forEach(function(x){ if(x.category) cats[x.category] = 1; });
  var sorted = Object.keys(cats).sort();
  // category sidebar buttons
  $('catFilters').innerHTML = sorted.map(function(c){
    var n = items.filter(function(x){ return x.category === c; }).length;
    return '<button class="filter-btn" data-cat="' + esc(c) + '">' +
      '<span style="display:flex;align-items:center;gap:7px;min-width:0"><span class="cdot2" style="background:' + catColor(c) + '"></span>' +
      '<span style="overflow:hidden;text-overflow:ellipsis">' + esc(c) + '</span></span>' +
      '<span class="count">' + n + '</span></button>';
  }).join('');
  Array.prototype.forEach.call($('catFilters').children, function(b){
    b.addEventListener('click', function(){
      catFilter = b.getAttribute('data-cat');
      paintFilterGroup('[data-cat]', 'data-cat', catFilter);
      render();
    });
  });
  // location autocomplete for the editor
  var locs = {};
  items.forEach(function(x){ if(x.location) locs[x.location] = 1; });
  $('locList').innerHTML = Object.keys(locs).sort().map(function(l){
    return '<option value="' + esc(l) + '">';
  }).join('');
  // category select in editor
  var ecs = $('ed_category'), ecv = ecs.value;
  ecs.innerHTML = '<option value=""></option>' +
    sorted.map(function(c){
      return '<option' + (c === ecv ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');
}

function paintFilterGroup(sel, attr, val){
  Array.prototype.forEach.call(document.querySelectorAll(sel), function(b){
    b.classList.toggle('active', b.getAttribute(attr) === val);
  });
}

/* ---------- editor ---------- */
function fillSelect(id, field, current){
  var el = $(id);
  el.innerHTML = optionsFor(field).map(function(v){
    return '<option' + (v === current ? ' selected' : '') + '>' + esc(v) + '</option>';
  }).join('');
  if(!current) el.innerHTML = '<option value="" selected></option>' + el.innerHTML;
}
function setSelectIf(id, v){
  if(!v) return;
  var el = $(id);
  for(var i = 0; i < el.options.length; i++){
    if(el.options[i].value === v || el.options[i].text === v){ el.selectedIndex = i; return; }
  }
}

/* name autocomplete — mirrors the legacy quick-add suggestions */
var edSuggestIndex = -1;
function edNameInput(){
  var val = $('ed_name').value.trim().toLowerCase();
  var box = $('ed_suggest');
  edSuggestIndex = -1;
  if(val.length < 1){ box.hidden = true; return; }
  var seen = {}, matches = [];
  for(var k = 0; k < items.length && matches.length < 10; k++){
    var n = items[k].name;
    if(n && n.toLowerCase().indexOf(val) !== -1 && !seen[n]){ seen[n] = 1; matches.push(n); }
  }
  if(!matches.length){ box.hidden = true; return; }
  box.innerHTML = matches.map(function(n){
    return '<div class="suggest-item">' + esc(n) + '</div>';
  }).join('');
  box.hidden = false;
  Array.prototype.forEach.call(box.children, function(el){
    el.addEventListener('mousedown', function(e){
      e.preventDefault();
      edPickName(el.textContent);
    });
  });
  for(var j = 0; j < items.length; j++){   // exact match → prefill category like legacy
    if(String(items[j].name).toLowerCase() === val){
      if(items[j].category) setSelectIf('ed_category', items[j].category);
      break;
    }
  }
}
function edNameKey(e){
  var box = $('ed_suggest'), list = box.children;
  if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !box.hidden && list.length){
    e.preventDefault();
    edSuggestIndex = e.key === 'ArrowDown'
      ? Math.min(edSuggestIndex + 1, list.length - 1)
      : Math.max(edSuggestIndex - 1, 0);
    Array.prototype.forEach.call(list, function(el, i){
      el.classList.toggle('active', i === edSuggestIndex);
    });
  }else if((e.key === 'Enter' || e.key === 'Tab') && edSuggestIndex >= 0 && list[edSuggestIndex] && !box.hidden){
    e.preventDefault();
    edPickName(list[edSuggestIndex].textContent);
  }else if(e.key === 'Escape'){
    box.hidden = true;
  }
}
function edPickName(name){
  $('ed_name').value = name;
  $('ed_suggest').hidden = true;
  edSuggestIndex = -1;
  for(var j = 0; j < items.length; j++){
    if(items[j].name === name){
      if(items[j].category) setSelectIf('ed_category', items[j].category);
      if(items[j].condition) setSelectIf('ed_condition', items[j].condition);
      break;
    }
  }
}

/* qty stepper */
function stepQty(d){
  var el = $('ed_qty');
  var v = parseInt(el.value, 10);
  if(isNaN(v)) v = 0;
  el.value = String(Math.max(0, v + d));
}

/* read-only change history, from the sheet's change_log (legacy inspector parity) */
function renderHistory(item){
  var wrap = $('edHistoryWrap'), box = $('edHistory');
  var log = [];
  if(item && item.change_log){
    try{ log = JSON.parse(item.change_log); }catch(e){ log = []; }
    if(!Array.isArray(log)) log = [];
  }
  if(!log.length){ wrap.hidden = true; box.innerHTML = ''; return; }
  wrap.hidden = false;
  box.innerHTML = log.slice(-8).reverse().map(function(en){
    var t = '';
    try{
      var d = new Date(en.at);
      t = d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' +
          d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    }catch(e){}
    return '<div class="hist-entry"><span class="hf">' + esc(en.field || '') + '</span>' +
      esc(en.from == null ? '' : en.from) + ' → ' + esc(en.to == null ? '' : en.to) +
      (t ? ' <span class="ht">· ' + esc(t) + '</span>' : '') + '</div>';
  }).join('');
}

function openEditor(item){
  editingId = item ? item.id : null;
  $('edTitle').textContent = item ? 'Edit Item' : 'Add Item';
  $('edDelete').hidden = !item;
  $('edDupe').hidden = !item;
  $('ed_suggest').hidden = true; edSuggestIndex = -1;
  $('edStatus').textContent = '';
  var g = function(k){ return item ? (item[k] == null ? '' : item[k]) : ''; };
  $('ed_name').value = g('name');
  // Quick Add auto-location: prefill from the selected sidebar location (legacy behavior)
  $('ed_location').value = item ? g('location') : (locFilter || '');
  $('ed_category').value = g('category');
  $('ed_qty').value = g('qty') || '1';
  $('ed_sn').value = g('sn');
  $('ed_doc_type').value = g('doc_type');
  $('ed_year_purchased').value = g('year_purchased');
  $('ed_last_used').value = g('last_used');
  $('ed_est_value').value = g('est_value');
  $('ed_keywords').value = g('keywords');
  $('ed_notes').value = g('notes');
  $('ed_in_use').checked = !!(item && isTrue(item.in_use));
  $('ed_digital_copy').checked = !!(item && isTrue(item.digital_copy));
  fillSelect('ed_condition', 'condition', item ? g('condition') : 'Good');
  fillSelect('ed_keep', 'keep', g('keep') || 'Keep');
  fillSelect('ed_frequency', 'frequency', g('frequency'));
  fillSelect('ed_criticality', 'criticality', g('criticality'));
  fillSelect('ed_replaceability', 'replaceability', g('replaceability'));
  fillSelect('ed_fill_level', 'fill_level', g('fill_level'));
  renderHistory(item);
  $('overlay').classList.add('open');
  setTimeout(function(){ $('ed_name').focus(); }, 50);
}
function closeEditor(){ $('overlay').classList.remove('open'); editingId = null; }

var FIELD_LABELS = {name:'Name',location:'Location',category:'Category',qty:'Qty',condition:'Condition',keep:'Keep',frequency:'Frequency',criticality:'Criticality',replaceability:'Replaceability',fill_level:'Fill Level',sn:'Serial',doc_type:'Doc Type',year_purchased:'Year',last_used:'Last Used',est_value:'Est Value',keywords:'Keywords',notes:'Notes',in_use:'In Use',digital_copy:'Digital Copy'};

function collectEditorFields(){
  return {
    name: $('ed_name').value.trim(),
    location: $('ed_location').value.trim(),
    category: $('ed_category').value,
    qty: $('ed_qty').value.trim() || '1',
    condition: $('ed_condition').value,
    keep: $('ed_keep').value,
    frequency: $('ed_frequency').value,
    criticality: $('ed_criticality').value,
    replaceability: $('ed_replaceability').value,
    fill_level: $('ed_fill_level').value,
    sn: $('ed_sn').value.trim(),
    doc_type: $('ed_doc_type').value.trim(),
    year_purchased: $('ed_year_purchased').value.trim(),
    last_used: $('ed_last_used').value.trim(),
    est_value: $('ed_est_value').value.trim(),
    keywords: $('ed_keywords').value.trim(),
    notes: $('ed_notes').value,
    in_use: $('ed_in_use').checked,
    digital_copy: $('ed_digital_copy').checked
  };
}

async function saveEditor(keepOpen){
  var fields = collectEditorFields();
  if(!fields.name){ alert('Item name is required.'); $('ed_name').focus(); return; }
  var isNew = editingId == null;
  var it, old = null;
  if(isNew){
    it = Object.assign({ id: 't' + Date.now() }, fields);   // temp id until the server assigns one
    items.unshift(it);
  }else{
    old = items.find(function(x){ return x.id === editingId; }) || {};
    it = Object.assign({}, old, fields, { id: editingId });  // keep sheet fields the editor doesn't touch
    var log = [];
    try{ log = JSON.parse(old.change_log || '[]'); }catch(e){ log = []; }
    if(!Array.isArray(log)) log = [];
    var now = new Date().toISOString();
    Object.keys(FIELD_LABELS).forEach(function(k){
      var a = String(old[k] == null ? '' : old[k]);
      var b = String(fields[k] == null ? '' : fields[k]);
      if(a !== b) log.push({field: FIELD_LABELS[k], from: a, to: b, at: now});
    });
    if(log.length) it.change_log = JSON.stringify(log);
    var idx = items.findIndex(function(x){ return x.id === editingId; });
    if(idx > -1) items[idx] = it;
  }
  if(keepOpen){
    // "Save & Add Another" (legacy): stay open, location sticky, reset the rest
    var keepLoc = fields.location;
    editingId = null;
    $('edTitle').textContent = 'Add Item';
    $('edDelete').hidden = true;
    $('edDupe').hidden = true;
    $('ed_name').value = '';
    $('ed_qty').value = '1';
    $('ed_sn').value = '';
    $('ed_keywords').value = '';
    $('ed_notes').value = '';
    $('ed_est_value').value = '';
    $('ed_in_use').checked = false;
    $('ed_digital_copy').checked = false;
    $('ed_location').value = keepLoc;
    $('ed_suggest').hidden = true; edSuggestIndex = -1;
    $('edStatus').textContent = 'Added "' + fields.name + '" → ' + (keepLoc || '(no location)');
    renderHistory(null);
    setTimeout(function(){ $('ed_name').focus(); }, 30);
  }else{
    closeEditor();
  }
  tree = buildTree(items);
  persist(); renderTree(); render(); setSync('sync');
  try{
    var body = Object.assign({}, it);
    if(isNew) delete body.id;           // server assigns max+1
    var r = await apiPost({action:'upsert', items:[body]});
    if(isNew && r.ids && r.ids[0] != null) it.id = r.ids[0];  // `it` is the array entry itself
    persist(); render();
    setSync(pending.length ? 'err' : 'ok');
  }catch(e){
    pending.push({t:'upsert', item:it, isNew:isNew});
    setSync('err');
  }
}

/* Duplicate — mirrors the legacy "Dupe Add": prefill a fresh add form from an item */
function duplicateEditing(){
  var src = items.find(function(x){ return x.id === editingId; });
  if(!src) return;
  openEditor(null);
  var g = function(k){ return src[k] == null ? '' : src[k]; };
  $('ed_name').value = g('name') ? g('name') + ' (copy)' : '';
  $('ed_location').value = g('location');
  $('ed_qty').value = g('qty') || '1';
  $('ed_sn').value = '';
  $('ed_doc_type').value = g('doc_type');
  $('ed_year_purchased').value = g('year_purchased');
  $('ed_last_used').value = g('last_used');
  $('ed_est_value').value = g('est_value');
  $('ed_keywords').value = g('keywords');
  $('ed_notes').value = g('notes');
  $('ed_in_use').checked = false;
  $('ed_digital_copy').checked = !!isTrue(src.digital_copy);
  setSelectIf('ed_category', g('category'));
  fillSelect('ed_condition', 'condition', g('condition'));
  fillSelect('ed_keep', 'keep', g('keep') || 'Keep');
  fillSelect('ed_frequency', 'frequency', g('frequency'));
  fillSelect('ed_criticality', 'criticality', g('criticality'));
  fillSelect('ed_replaceability', 'replaceability', g('replaceability'));
  fillSelect('ed_fill_level', 'fill_level', g('fill_level'));
  $('edStatus').textContent = 'Duplicating "' + (src.name || 'item') + '" — edit and save as new.';
  setTimeout(function(){ $('ed_name').focus(); $('ed_name').select(); }, 50);
}

async function deleteEditing(){
  if(editingId == null) return;
  var it = items.find(function(x){ return x.id === editingId; });
  if(!confirm('Delete "' + (it ? it.name : 'item') + '"? This cannot be undone.')) return;
  var id = editingId;
  items = items.filter(function(x){ return x.id !== id; });
  pending = pending.filter(function(op){ return !(op.t === 'upsert' && op.item.id === id); });
  closeEditor();
  tree = buildTree(items);
  persist(); renderTree(); render(); setSync('sync');
  try{
    if(typeof id === 'number') await apiPost({action:'delete', ids:[id]});
    setSync(pending.length ? 'err' : 'ok');
  }catch(e){
    if(typeof id === 'number') pending.push({t:'delete', ids:[id]});
    setSync('err');
  }
}

/* ---------- wire up ---------- */
$('search').addEventListener('input', render);
$('addBtn').addEventListener('click', function(){ openEditor(null); });
$('edCancel').addEventListener('click', closeEditor);
$('edSave').addEventListener('click', function(){ saveEditor(false); });
$('edSaveAnother').addEventListener('click', function(){ saveEditor(true); });
$('edDelete').addEventListener('click', deleteEditing);
$('edDupe').addEventListener('click', duplicateEditing);
$('ed_name').addEventListener('input', edNameInput);
$('ed_name').addEventListener('keydown', edNameKey);
$('qtyMinus').addEventListener('click', function(){ stepQty(-1); });
$('qtyPlus').addEventListener('click', function(){ stepQty(1); });
$('syncBadge').addEventListener('click', function(){ load(); });
$('overlay').addEventListener('click', function(e){ if(e.target === $('overlay')) closeEditor(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeEditor(); });
$('treeFilter').addEventListener('input', function(){
  treeQuery = $('treeFilter').value;
  renderTree();
});
$('locAllBtn').addEventListener('click', function(){
  locFilter = null;
  $('locAllBtn').classList.add('active');
  paintLocChip(); renderTree(); render();
});
$('locChipX').addEventListener('click', function(){
  locFilter = null;
  $('locAllBtn').classList.add('active');
  paintLocChip(); renderTree(); render();
});
$('sbToggle').addEventListener('click', function(){
  $('sidebar').classList.toggle('open');
});

// sidebar filter groups: view / fill
Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function(b){
  b.addEventListener('click', function(){
    viewFilter = b.getAttribute('data-view');
    paintFilterGroup('[data-view]', 'data-view', viewFilter);
    render();
  });
});
Array.prototype.forEach.call(document.querySelectorAll('[data-fill]'), function(b){
  b.addEventListener('click', function(){
    fillFilter = b.getAttribute('data-fill');
    paintFilterGroup('[data-fill]', 'data-fill', fillFilter);
    render();
  });
});

load();
