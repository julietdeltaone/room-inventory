<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Locate — Inventory</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --text:#e8eaf0; --muted:#9aa0ae; --accent:#4da3ff;
    --green:#3ecf6e; --yellow:#e8b93e; --red:#e5534b;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 60px}
  header.top{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}
  header.top h1{font-size:22px;margin:0;flex:1}
  .navlink{color:var(--accent);text-decoration:none;font-size:14px;
    padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius)}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    cursor:pointer;user-select:none}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--green)} .dot.sync{background:var(--yellow)} .dot.err{background:var(--red)}
  .search{width:100%;padding:14px;font-size:17px;background:var(--card2);
    border:1px solid var(--line);border-radius:var(--radius);color:var(--text);margin-bottom:6px}
  .search:focus{outline:none;border-color:var(--accent)}
  h2.sec{font-size:14px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:18px 2px 8px}
  /* find results */
  .results{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:4px}
  .rrow{display:block;width:100%;text-align:left;background:none;border:none;
    border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer;color:var(--text)}
  .rrow:last-child{border-bottom:none}
  .rrow:active{background:#ffffff10}
  .rrow .rn{font-weight:600;font-size:15px}
  .rrow .rl{color:var(--muted);font-size:13px;margin-top:2px}
  .flag{color:var(--red);margin-right:4px}
  .more{padding:10px;text-align:center;color:var(--muted);font-size:13px}
  /* tree */
  .tree{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 4px}
  .tree ul{list-style:none;margin:0;padding-left:18px}
  .tree > ul{padding-left:4px}
  .tnode{margin:1px 0}
  .trow{display:flex;align-items:center;gap:6px;padding:9px 8px;border-radius:8px;cursor:pointer}
  .trow:active{background:#ffffff0d}
  .trow.sel{background:#4da3ff1c;outline:1px solid var(--accent)}
  .caret{width:22px;flex:none;text-align:center;color:var(--muted);font-size:13px;
    padding:4px 0;cursor:pointer}
  .tname{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tcount{font-size:12px;color:var(--muted);flex:none}
  .tcount b{color:var(--text);font-weight:600}
  /* selected-location item list */
  .locpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-top:12px;overflow:hidden}
  .locpanel .ph{padding:12px;border-bottom:1px solid var(--line)}
  .locpanel .ph .p{font-weight:700;font-size:15px}
  .locpanel .ph .t{margin-top:8px}
  .tgl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
  .tgl input{width:16px;height:16px;accent-color:var(--accent)}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
  /* detail modal */
  .overlay{position:fixed;inset:0;background:#000a;display:none;
    align-items:flex-start;justify-content:center;z-index:50;padding:12px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:560px;margin:20px 0;padding:18px}
  .modal h2{margin:0 0 4px;font-size:19px}
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
  .crumb{background:var(--card2);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:13px}
  .crumb.sep{background:none;border:none;padding:6px 0;color:var(--muted)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px;margin-bottom:6px}
  .kv .k{color:var(--muted)}
  .kv .v{overflow-wrap:anywhere}
  .notes{margin-top:10px;font-size:14px;color:var(--text);white-space:pre-wrap}
  .mrow{display:flex;gap:10px;margin-top:16px}
  .btn{padding:13px 18px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
  .btn.close{flex:1}
  .btn.misplaced{flex:1;border-color:var(--red);color:var(--red);background:none}
  .btn.misplaced.on{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="navlink" href="index.html">⌂ Inventory</a>
    <h1>Locate</h1>
    <span class="sync" id="syncBadge" title="Tap to retry sync">
      <span class="dot" id="syncDot"></span><span id="syncText">…</span>
    </span>
  </header>

  <input class="search" id="find" type="search" placeholder="Find an item…" autocomplete="off">
  <div class="results" id="findResults" hidden></div>

  <h2 class="sec">Browse by location</h2>
  <div class="tree" id="tree"></div>

  <div class="locpanel" id="locPanel" hidden>
    <div class="ph">
      <div class="p" id="locPath"></div>
      <div class="t"><label class="tgl"><input type="checkbox" id="inclSubs"> Include sub-locations</label></div>
    </div>
    <div id="locItems"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="dName"></h2>
    <div class="crumbs" id="dCrumbs"></div>
    <div class="kv" id="dFields"></div>
    <div class="notes" id="dNotes"></div>
    <div class="mrow">
      <button class="btn misplaced" id="dMisplaced">⚑ Misplaced</button>
      <button class="btn close" id="dClose">Close</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   DEPLOY-TIME CONFIG — the ONLY thing to change when deploying.
   Paste the Apps Script web app /exec URL between the quotes.
   ═══════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyH0hgBBMiM-D64AEC4S90T4aWDvL7BPtQGXLY50DltWIGOqHTy3Yvkgf-gegPuAWKZ/exec';

const CACHE_KEY = 'inv_v3_cache';

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function num(v){
  var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
function money(v){
  var n = num(v);
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits: n % 1 ? 2 : 0});
}

/* ---------- state ---------- */
var items = [];
var pending = [];
var tree = null;
var expanded = {};        // path -> true
var selectedPath = null;  // path string of tapped node
var detailId = null;

function setSync(state){
  var dot = $('syncDot'), txt = $('syncText');
  dot.className = 'dot ' + (state === 'ok' ? 'ok' : state === 'sync' ? 'sync' : 'err');
  txt.textContent = state === 'ok' ? 'saved' : state === 'sync' ? 'syncing…' : 'offline';
}

async function apiPost(body){
  var res = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || 'API error');
  return j;
}
function persist(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(items)); }catch(e){}
}
async function load(){
  setSync('sync');
  try{
    var res = await fetch(API_URL + '?action=list');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var j = await res.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'API error');
    items = j.items || [];
    persist();
    setSync(pending.length ? 'err' : 'ok');
    if(pending.length) flushPending();
  }catch(e){
    try{ items = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); }catch(_){ items = []; }
    setSync('err');
  }
  tree = buildTree(items);
  renderTree();
}
async function flushPending(){
  if(!pending.length) return;
  setSync('sync');
  var q = pending.slice(); pending = [];
  for(var k = 0; k < q.length; k++){
    try{ await apiPost({action:'patch', id:q[k].id, fields:q[k].fields}); }
    catch(e){ pending.push(q[k]); }
  }
  persist();
  setSync(pending.length ? 'err' : 'ok');
}

/* ---------- location tree ---------- */
function buildTree(list){
  var root = {name:'', children:{}, items:[], total:0};
  list.forEach(function(it){
    var loc = String(it.location || '').trim();
    var parts = loc ? loc.split(' > ') : ['(no location)'];
    var node = root;
    node.total++;
    parts.forEach(function(p){
      if(!node.children[p]) node.children[p] = {name:p, children:{}, items:[], total:0, path:''};
      node = node.children[p];
      node.total++;
    });
    node.items.push(it);
  });
  // fill in full paths
  (function walk(n, prefix){
    Object.keys(n.children).forEach(function(k){
      var c = n.children[k];
      c.path = prefix ? prefix + ' > ' + k : k;
      walk(c, c.path);
    });
  })(root, '');
  return root;
}

function renderTree(){
  var el = $('tree');
  function nodeHtml(n){
    var keys = Object.keys(n.children).sort();
    if(!keys.length) return '';
    return '<ul>' + keys.map(function(k){
      var c = n.children[k];
      var has = Object.keys(c.children).length > 0;
      var open = !!expanded[c.path];
      var caret = has ? '<span class="caret" data-caret="' + esc(c.path) + '">' + (open ? '▾' : '▸') + '</span>'
                      : '<span class="caret"></span>';
      var sel = selectedPath === c.path ? ' sel' : '';
      var html = '<li class="tnode"><div class="trow' + sel + '" data-path="' + esc(c.path) + '">' +
        caret + '<span class="tname">' + esc(c.name) + '</span>' +
        '<span class="tcount"><b>' + c.items.length + '</b> here · ' + c.total + ' total</span></div>';
      if(open) html += nodeHtml(c);
      return html + '</li>';
    }).join('') + '</ul>';
  }
  el.innerHTML = nodeHtml(tree) || '<div class="empty">No locations.</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-caret]'), function(sp){
    sp.addEventListener('click', function(e){
      e.stopPropagation();
      var p = sp.getAttribute('data-caret');
      expanded[p] = !expanded[p];
      renderTree();
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll('.trow'), function(row){
    row.addEventListener('click', function(){
      selectedPath = row.getAttribute('data-path');
      renderTree();
      showLocation(selectedPath);
    });
  });
}

function findNode(path){
  if(!path) return null;
  var node = tree, parts = path.split(' > ');
  for(var i = 0; i < parts.length; i++){
    node = node.children[parts[i]];
    if(!node) return null;
  }
  return node;
}
function collectItems(node, includeSubs){
  var out = node.items.slice();
  if(includeSubs){
    Object.keys(node.children).forEach(function(k){
      out = out.concat(collectItems(node.children[k], true));
    });
  }
  return out;
}

function showLocation(path){
  var node = findNode(path);
  var panel = $('locPanel');
  if(!node){ panel.hidden = true; return; }
  panel.hidden = false;
  $('locPath').textContent = path;
  renderLocItems();
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderLocItems(){
  var node = findNode(selectedPath);
  if(!node) return;
  var list = collectItems(node, $('inclSubs').checked);
  list.sort(function(a,b){
    return String(a.name||'').toLowerCase() < String(b.name||'').toLowerCase() ? -1 : 1;
  });
  $('locItems').innerHTML = list.length
    ? list.map(itemRow).join('')
    : '<div class="empty">No items here.</div>';
  bindRows($('locItems'));
}

function itemRow(i){
  var flag = i.misplaced ? '<span class="flag" title="Misplaced">⚑</span>' : '';
  return '<button class="rrow" data-id="' + esc(String(i.id)) + '">' +
    '<div class="rn">' + flag + esc(i.name || '(unnamed)') + '</div>' +
    '<div class="rl">' + esc(i.location || '—') +
    (i.qty && i.qty !== '1' ? ' · ×' + esc(i.qty) : '') + '</div></button>';
}
function bindRows(container){
  Array.prototype.forEach.call(container.querySelectorAll('[data-id]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      var it = items.find(function(x){ return String(x.id) === id; });
      if(it) openDetail(it);
    });
  });
}

/* ---------- find ---------- */
var FIND_LIMIT = 60;
$('find').addEventListener('input', function(){
  var q = $('find').value.trim().toLowerCase();
  var box = $('findResults');
  if(!q){ box.hidden = true; box.innerHTML = ''; return; }
  var hits = items.filter(function(i){
    return [i.name, i.notes, i.sn, i.location, i.category].join(' ').toLowerCase().indexOf(q) !== -1;
  });
  box.hidden = false;
  box.innerHTML = hits.length
    ? hits.slice(0, FIND_LIMIT).map(itemRow).join('') +
      (hits.length > FIND_LIMIT ? '<div class="more">' + (hits.length - FIND_LIMIT) + ' more… keep typing to narrow</div>' : '')
    : '<div class="empty">No matches.</div>';
  bindRows(box);
});

/* ---------- detail modal ---------- */
var DETAIL_FIELDS = [
  ['category','Category'], ['qty','Qty'], ['condition','Condition'], ['keep','Keep'],
  ['frequency','Frequency'], ['criticality','Criticality'],
  ['replaceability','Replaceability'], ['sn','Serial / Ref #'],
  ['year_purchased','Year Purchased'], ['last_used','Last Used'], ['est_value','Est. Value']
];
function openDetail(it){
  detailId = it.id;
  $('dName').textContent = it.name || '(unnamed)';
  var parts = String(it.location || '').split(' > ').filter(function(p){ return p; });
  $('dCrumbs').innerHTML = parts.length
    ? parts.map(function(p){ return '<span class="crumb">' + esc(p) + '</span>'; })
        .join('<span class="crumb sep">›</span>')
    : '<span class="crumb">(no location)</span>';
  $('dFields').innerHTML = DETAIL_FIELDS.map(function(f){
    var v = it[f[0]];
    if(f[0] === 'est_value' && v) v = money(v);
    return '<div class="k">' + esc(f[1]) + '</div><div class="v">' + esc(v || '—') + '</div>';
  }).join('');
  $('dNotes').textContent = it.notes || '';
  paintMisplaced(!!it.misplaced);
  $('overlay').classList.add('open');
}
function paintMisplaced(on){
  var b = $('dMisplaced');
  b.classList.toggle('on', on);
  b.innerHTML = on ? '⚑ Misplaced — tap to clear' : '⚑ Mark misplaced';
}
function closeDetail(){ $('overlay').classList.remove('open'); detailId = null; }

$('dMisplaced').addEventListener('click', async function(){
  var it = items.find(function(x){ return x.id === detailId; });
  if(!it || typeof it.id !== 'number'){ return; }  // not yet synced — toggle in main app
  var next = !it.misplaced;
  it.misplaced = next;
  paintMisplaced(next);
  persist(); renderTree(); renderLocItems(); renderFindAgain();
  setSync('sync');
  try{
    await apiPost({action:'patch', id:it.id, fields:{misplaced:next}});
    setSync(pending.length ? 'err' : 'ok');
  }catch(e){
    pending.push({id:it.id, fields:{misplaced:next}});
    setSync('err');
  }
});
function renderFindAgain(){
  var ev = new Event('input');
  $('find').dispatchEvent(ev);
}
$('dClose').addEventListener('click', closeDetail);
$('overlay').addEventListener('click', function(e){ if(e.target === $('overlay')) closeDetail(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDetail(); });
$('inclSubs').addEventListener('change', renderLocItems);
$('syncBadge').addEventListener('click', flushPending);

load();
</script>
</body>
</html>
