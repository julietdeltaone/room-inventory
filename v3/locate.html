<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Locate — Inventory</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --text:#e8eaf0; --muted:#9aa0ae; --accent:#4da3ff;
    --green:#3ecf6e; --yellow:#e8b93e; --red:#e5534b;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 60px}
  header.top{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}
  header.top h1{font-size:22px;margin:0;flex:1}
  .navlink{color:var(--accent);text-decoration:none;font-size:14px;
    padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius)}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    cursor:pointer;user-select:none}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--green)} .dot.sync{background:var(--yellow)} .dot.err{background:var(--red)}
  .search{width:100%;padding:14px;font-size:17px;background:var(--card2);
    border:1px solid var(--line);border-radius:var(--radius);color:var(--text);margin-bottom:6px}
  .search:focus{outline:none;border-color:var(--accent)}
  h2.sec{font-size:14px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
  h2.sec .sp{flex:1}
  .tbtn{background:var(--card2);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;font-size:12px;padding:6px 10px;cursor:pointer}
  .tbtn:active{background:#ffffff10}
  .tbtn.on{border-color:var(--red);color:var(--red)}
  button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  /* find results */
  .results{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:4px}
  .rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:none;border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer;
    color:var(--text);border-left:3px solid var(--catc,transparent)}
  .rrow:last-child{border-bottom:none}
  .rrow:active{background:#ffffff10}
  .rrow.misplaced{background:#e5534b12;border-left-color:var(--red)}
  .rrow .tx{flex:1;min-width:0}
  .rrow .rn{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .rrow .rl{color:var(--muted);font-size:13px;margin-top:3px;display:flex;
    align-items:center;gap:4px;flex-wrap:wrap}
  .cdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--catc,#888)}
  .crumb{font-size:12px;color:var(--muted);background:var(--card2);
    border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .cbadge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;
    white-space:nowrap;flex:none}
  .cbadge.New{background:#3ecf6e22;color:#3ecf6e}
  .cbadge.Good{background:#4da3ff22;color:#4da3ff}
  .cbadge.Fair{background:#e8b93e22;color:#e8b93e}
  .cbadge.Poor{background:#e5534b22;color:#e5534b}
  .cbadge.none{background:#ffffff10;color:var(--muted)}
  .flag{color:var(--red);flex:none}
  .more{padding:10px;text-align:center;color:var(--muted);font-size:13px}
  /* tree */
  .tree{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 4px}
  .tree ul{list-style:none;margin:0;padding-left:16px}
  .tree > ul{padding-left:2px}
  .tnode{margin:1px 0}
  .trow{display:flex;align-items:center;gap:7px;padding:9px 8px;border-radius:8px;
    cursor:pointer;border-left:3px solid transparent}
  .trow:active{background:#ffffff0d}
  .trow.sel{background:#4da3ff1c;outline:1px solid var(--accent)}
  .caret{width:34px;flex:none;text-align:center;color:var(--muted);font-size:14px;
    padding:10px 0;cursor:pointer;border-radius:8px}
  .lchip{width:11px;height:11px;border-radius:4px;flex:none}
  .tname{flex:1;font-size:15px;min-width:0}
  .tname .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .cbar{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:4px;
    background:#ffffff10}
  .cbar i{display:block;height:100%}
  .tcount{font-size:12px;color:var(--muted);flex:none;white-space:nowrap}
  .tcount b{color:var(--text);font-weight:600}
  /* selected-location item list */
  .locpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-top:12px;overflow:hidden}
  .locpanel .ph{padding:12px;border-bottom:1px solid var(--line)}
  .locpanel .ph .p{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .locpanel .ph .t{margin-top:8px}
  .tgl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
  .tgl input{width:16px;height:16px;accent-color:var(--accent)}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
  /* detail modal */
  .overlay{position:fixed;inset:0;background:#000a;display:none;
    align-items:flex-start;justify-content:center;z-index:50;padding:12px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:560px;margin:20px 0;padding:18px;border-top:3px solid var(--catc,#2a2f3a)}
  .modal h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:10px}
  .modal h2 .cdot{width:14px;height:14px}
  .catline{font-size:13px;margin:2px 0 0;font-weight:600}
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px;align-items:center}
  .crumb.big{font-size:13px;padding:6px 11px;border-radius:999px}
  .crumb.sep{background:none;border:none;padding:6px 0;color:var(--muted)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px;margin-bottom:6px}
  .kv .k{color:var(--muted)}
  .kv .v{overflow-wrap:anywhere}
  .notes{margin-top:10px;font-size:14px;color:var(--text);white-space:pre-wrap}
  .mrow{display:flex;gap:10px;margin-top:16px}
  .btn{padding:13px 18px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
  .btn.close{flex:1}
  .btn.misplaced{flex:1;border-color:var(--red);color:var(--red);background:none}
  .btn.misplaced.on{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="navlink" href="index.html">⌂ Inventory</a>
    <h1>Locate</h1>
    <span class="sync" id="syncBadge" title="Tap to retry sync">
      <span class="dot" id="syncDot"></span><span id="syncText">…</span>
    </span>
  </header>

  <input class="search" id="find" type="search" placeholder="Find an item…" autocomplete="off">
  <div class="results" id="findResults" hidden></div>

  <h2 class="sec"><span class="sp">Browse by location</span>
    <button class="tbtn" id="misToggle">⚑ Misplaced</button>
    <button class="tbtn" id="expandAll">Expand all</button>
    <button class="tbtn" id="collapseAll">Collapse</button>
  </h2>
  <div class="results" id="misPanel" hidden style="margin-bottom:12px"></div>
  <div class="tree" id="tree"></div>

  <div class="locpanel" id="locPanel" hidden>
    <div class="ph">
      <div class="p" id="locPath"></div>
      <div class="t"><label class="tgl"><input type="checkbox" id="inclSubs"> Include sub-locations</label></div>
    </div>
    <div id="locItems"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" id="dModal">
    <h2><span class="cdot" id="dDot"></span><span id="dName"></span></h2>
    <div class="catline" id="dCat"></div>
    <div class="crumbs" id="dCrumbs"></div>
    <div class="kv" id="dFields"></div>
    <div class="notes" id="dNotes"></div>
    <div class="mrow">
      <button class="btn misplaced" id="dMisplaced">⚑ Misplaced</button>
      <button class="btn close" id="dClose">Close</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   DEPLOY-TIME CONFIG — the ONLY thing to change when deploying.
   Paste the Apps Script web app /exec URL between the quotes.
   ═══════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyH0hgBBMiM-D64AEC4S90T4aWDvL7BPtQGXLY50DltWIGOqHTy3Yvkgf-gegPuAWKZ/exec';

const CACHE_KEY = 'inv_v3_cache';

/* ---------- color system (shared with index.html) ---------- */
var CAT_COLORS = {
  'Clothing':'#5aa9ff','Memorabilia & Keepsakes':'#c78bff','Cables & Charging':'#ffd166',
  'Electronics':'#4dd0e1','Accessories':'#ff8a65','Personal Care & Grooming':'#80cbc4',
  'Office Supplies':'#aed581','Tools & Hardware':'#ffab40','Camera/Photo Gear':'#f06292',
  'Legal Documents':'#90a4ae','Identity Documents':'#b0bec5','Automotive':'#ef5350',
  'Financial Documents':'#66bb6a','Cleaning & Home':'#26c6da','Health & Supplements':'#ab47bc',
  'Footwear':'#8d6e63','Books & Notebooks':'#d4e157','Gym & Fitness':'#26a69a',
  'Misc':'#9e9e9e','Military':'#7cb342','Firearms & Ammo':'#ff5252','Bags & Carry':'#5c6bc0',
  'Military Documents':'#78909c','Vehicle Documents':'#ffa726','Furniture':'#a1887f'
};
function catColor(c){
  c = String(c == null ? '' : c);
  if(CAT_COLORS[c]) return CAT_COLORS[c];
  if(!c) return '#6b7280';
  var h = 0;
  for(var i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) % 360;
  return 'hsl(' + h + ',60%,62%)';
}
var LOC_COLORS = {
  'Bedroom':'#5aa9ff','Basement':'#b088ff','Hallway':'#ffd166','Tesla':'#ff6b6b',
  'Barn':'#ffa94d','SUNY Potsdam (Maxcy)':'#4dd0e1','Unassigned':'#9aa0ae',
  'Clarkson':'#7ee081','(no location)':'#6b7280'
};
function locColor(path){
  var top = String(path == null ? '' : path).split(' > ')[0] || '(no location)';
  return LOC_COLORS[top] || '#6b7280';
}
function condClass(cond){
  return ['New','Good','Fair','Poor'].indexOf(cond) > -1 ? cond : 'none';
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function num(v){
  var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
function money(v){
  var n = num(v);
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits: n % 1 ? 2 : 0});
}

/* ---------- state ---------- */
var items = [];
var pending = [];
var tree = null;
var expanded = {};        // path -> true
var selectedPath = null;  // path string of tapped node
var detailId = null;

function setSync(state){
  var dot = $('syncDot'), txt = $('syncText');
  dot.className = 'dot ' + (state === 'ok' ? 'ok' : state === 'sync' ? 'sync' : 'err');
  txt.textContent = state === 'ok' ? 'saved' : state === 'sync' ? 'syncing…' : 'offline — saved locally';
}

function fetchWithTimeout(url, opts, ms){
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 20000);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal})).then(
    function(res){
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res;
    },
    function(err){ clearTimeout(timer); throw err; }
  );
}
async function apiPost(body){
  var res = await fetchWithTimeout(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)
  }, 25000);
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || 'API error');
  return j;
}
function persist(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(items)); }catch(e){}
}
async function load(){
  setSync('sync');
  var j = null;
  for(var a = 0; a < 2 && !j; a++){   // one automatic retry before falling back to cache
    try{
      var r = await fetchWithTimeout(API_URL + '?action=list', null, 20000);
      var d = await r.json();
      if(d && d.ok) j = d;
    }catch(e){ j = null; }
  }
  if(j){
    items = j.items || [];
    persist();
    setSync(pending.length ? 'err' : 'ok');
    if(pending.length) flushPending();
  }else{
    try{ items = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); }catch(_){ items = []; }
    setSync('err');
  }
  tree = buildTree(items);
  renderTree();
  renderMisplaced();
}
async function flushPending(){
  if(!pending.length) return;
  setSync('sync');
  var q = pending.slice(); pending = [];
  for(var k = 0; k < q.length; k++){
    try{ await apiPost({action:'patch', id:q[k].id, fields:q[k].fields}); }
    catch(e){ pending.push(q[k]); }
  }
  tree = buildTree(items);
  persist(); renderTree(); renderLocItems();
  setSync(pending.length ? 'err' : 'ok');
}

/* ---------- location tree ---------- */
function buildTree(list){
  var root = {name:'', children:{}, items:[], total:0, catCounts:{}};
  list.forEach(function(it){
    var loc = String(it.location || '').trim();
    var parts = loc ? loc.split(' > ') : ['(no location)'];
    var node = root;
    node.total++;
    bumpCat(node, it);
    parts.forEach(function(p){
      if(!node.children[p]) node.children[p] = {name:p, children:{}, items:[], total:0, catCounts:{}, path:''};
      node = node.children[p];
      node.total++;
      bumpCat(node, it);
    });
    node.items.push(it);
  });
  (function walk(n, prefix){
    Object.keys(n.children).forEach(function(k){
      var c = n.children[k];
      c.path = prefix ? prefix + ' > ' + k : k;
      walk(c, c.path);
    });
  })(root, '');
  return root;
}
function bumpCat(node, it){
  var c = String(it.category || '') || '(none)';
  node.catCounts[c] = (node.catCounts[c] || 0) + 1;
}
function catBarHtml(catCounts, total){
  var keys = Object.keys(catCounts).sort(function(a,b){ return catCounts[b] - catCounts[a]; });
  var segs = keys.slice(0, 8).map(function(k){
    var w = Math.max(3, Math.round(catCounts[k] / total * 100));
    return '<i style="width:' + w + '%;background:' + catColor(k) + '" title="' + esc(k) + ' ' + catCounts[k] + '"></i>';
  }).join('');
  return '<span class="cbar">' + segs + '</span>';
}

function renderTree(){
  var el = $('tree');
  if(!tree){ el.innerHTML = '<div class="empty">No locations.</div>'; return; }
  function nodeHtml(n, branch){
    var keys = Object.keys(n.children).sort();
    if(!keys.length) return '';
    return '<ul>' + keys.map(function(k){
      var c = n.children[k];
      var bcol = branch || locColor(c.path);
      var has = Object.keys(c.children).length > 0;
      var open = !!expanded[c.path];
      var caret = has
        ? '<span class="caret" tabindex="0" role="button" aria-label="Expand or collapse ' + esc(c.name) + '" data-caret="' + esc(c.path) + '">' + (open ? '▾' : '▸') + '</span>'
        : '<span class="caret"></span>';
      var sel = selectedPath === c.path ? ' sel' : '';
      var html = '<li class="tnode"><div class="trow' + sel + '" data-path="' + esc(c.path) + '"' +
        ' tabindex="0" role="button" title="Tap to view items here"' +
        ' style="border-left-color:' + bcol + '55">' +
        caret + '<span class="lchip" style="background:' + bcol + '"></span>' +
        '<span class="tname"><span class="tn">' + esc(c.name) + '</span>' +
        catBarHtml(c.catCounts, c.total) + '</span>' +
        '<span class="tcount"><b>' + c.items.length + '</b> here · ' + c.total + ' total</span></div>';
      if(open) html += nodeHtml(c, bcol);
      return html + '</li>';
    }).join('') + '</ul>';
  }
  el.innerHTML = nodeHtml(tree, null) || '<div class="empty">No locations.</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-caret]'), function(sp){
    var tog = function(e){
      if(e){ e.stopPropagation(); e.preventDefault(); }
      var p = sp.getAttribute('data-caret');
      expanded[p] = !expanded[p];
      renderTree();
    };
    sp.addEventListener('click', tog);
    sp.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ tog(e); }
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll('.trow'), function(row){
    var go = function(){
      var p = row.getAttribute('data-path');
      if(selectedPath === p){          // tap again to clear
        selectedPath = null;
        $('locPanel').hidden = true;
        renderTree();
        return;
      }
      selectedPath = p;
      renderTree();
      showLocation(selectedPath);
    };
    row.addEventListener('click', go);
    row.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    });
  });
}
function setExpandedAll(on){
  if(on){
    (function walk(n){
      Object.keys(n.children).forEach(function(k){
        var c = n.children[k];
        if(Object.keys(c.children).length) expanded[c.path] = true;
        walk(c);
      });
    })(tree);
  }else{
    expanded = {};
  }
  renderTree();
}

function findNode(path){
  if(!path) return null;
  var node = tree, parts = path.split(' > ');
  for(var i = 0; i < parts.length; i++){
    node = node.children[parts[i]];
    if(!node) return null;
  }
  return node;
}
function collectItems(node, includeSubs){
  var out = node.items.slice();
  if(includeSubs){
    Object.keys(node.children).forEach(function(k){
      out = out.concat(collectItems(node.children[k], true));
    });
  }
  return out;
}

function showLocation(path){
  var node = findNode(path);
  var panel = $('locPanel');
  if(!node){ panel.hidden = true; return; }
  panel.hidden = false;
  var parts = path.split(' > ');
  $('locPath').innerHTML = parts.map(function(p){
    return '<span class="crumb big" style="border-color:' + locColor(path) + '66">' + esc(p) + '</span>';
  }).join('<span style="color:var(--muted)">›</span>');
  renderLocItems();
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderLocItems(){
  var node = findNode(selectedPath);
  if(!node) return;
  var list = collectItems(node, $('inclSubs').checked);
  list.sort(function(a,b){
    return String(a.name||'').toLowerCase() < String(b.name||'').toLowerCase() ? -1 : 1;
  });
  $('locItems').innerHTML = list.length
    ? list.map(itemRow).join('')
    : '<div class="empty">No items here.</div>';
  bindRows($('locItems'));
}

function itemRow(i){
  var cc = catColor(i.category);
  var flag = i.misplaced ? '<span class="flag" title="Misplaced">⚑</span>' : '';
  var badge = '<span class="cbadge ' + condClass(i.condition) + '">' + esc(i.condition || '—') + '</span>';
  var parts = String(i.location || '').split(' > ').filter(function(p){ return p; });
  var show = parts.slice(-2);
  var crumbs = show.length
    ? show.map(function(p){ return '<span class="crumb">' + esc(p) + '</span>'; })
        .join('<span style="color:var(--muted);font-size:11px">›</span>')
    : '<span class="crumb">—</span>';
  return '<button class="rrow' + (i.misplaced ? ' misplaced' : '') + '" data-id="' + esc(String(i.id)) + '"' +
    ' style="--catc:' + cc + '">' +
    '<span class="cdot"></span>' +
    '<span class="tx"><span class="rn">' + flag + esc(i.name || '(unnamed)') +
    (i.qty && i.qty !== '1' ? ' <span style="color:var(--muted);font-weight:400">×' + esc(i.qty) + '</span>' : '') +
    '</span><span class="rl">' + crumbs + '</span></span>' +
    badge + '</button>';
}
function bindRows(container){
  Array.prototype.forEach.call(container.querySelectorAll('[data-id]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      var it = items.find(function(x){ return String(x.id) === id; });
      if(it) openDetail(it);
    });
  });
}

/* ---------- misplaced quick view ---------- */
var showMisplaced = false;
function renderMisplaced(){
  var box = $('misPanel');
  var list = items.filter(function(i){ return i.misplaced; }).sort(function(a, b){
    var an = String(a.name || '').toLowerCase(), bn = String(b.name || '').toLowerCase();
    return an < bn ? -1 : an > bn ? 1 : 0;
  });
  var btn = $('misToggle');
  btn.textContent = '⚑ Misplaced' + (list.length ? ' (' + list.length + ')' : '');
  btn.classList.toggle('on', showMisplaced);
  if(!showMisplaced){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = list.length
    ? list.map(itemRow).join('')
    : '<div class="empty">Nothing misplaced right now. 🎉</div>';
  bindRows(box);
}
$('misToggle').addEventListener('click', function(){
  showMisplaced = !showMisplaced;
  renderMisplaced();
  if(showMisplaced) $('misPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
});

/* ---------- find ---------- */
var FIND_LIMIT = 60;
$('find').addEventListener('input', function(){
  var q = $('find').value.trim().toLowerCase();
  var box = $('findResults');
  if(!q){ box.hidden = true; box.innerHTML = ''; return; }
  var hits = items.filter(function(i){
    return [i.name, i.notes, i.sn, i.location, i.category].join(' ').toLowerCase().indexOf(q) !== -1;
  });
  box.hidden = false;
  box.innerHTML = hits.length
    ? hits.slice(0, FIND_LIMIT).map(itemRow).join('') +
      (hits.length > FIND_LIMIT ? '<div class="more">' + (hits.length - FIND_LIMIT) + ' more… keep typing to narrow</div>' : '')
    : '<div class="empty">No matches.</div>';
  bindRows(box);
});

/* ---------- detail modal ---------- */
var DETAIL_FIELDS = [
  ['category','Category'], ['qty','Qty'], ['condition','Condition'], ['keep','Keep'],
  ['frequency','Frequency'], ['criticality','Criticality'],
  ['replaceability','Replaceability'], ['sn','Serial / Ref #'],
  ['year_purchased','Year Purchased'], ['last_used','Last Used'], ['est_value','Est. Value']
];
function openDetail(it){
  detailId = it.id;
  var cc = catColor(it.category);
  $('dModal').style.setProperty('--catc', cc);
  $('dDot').style.background = cc;
  $('dName').textContent = it.name || '(unnamed)';
  $('dCat').innerHTML = '<span style="color:' + cc + '">●</span> ' + esc(it.category || 'Uncategorized') +
    ' &nbsp;<span class="cbadge ' + condClass(it.condition) + '">' + esc(it.condition || '—') + '</span>';
  var parts = String(it.location || '').split(' > ').filter(function(p){ return p; });
  $('dCrumbs').innerHTML = parts.length
    ? parts.map(function(p){
        return '<span class="crumb big" style="border-color:' + locColor(it.location) + '66">' + esc(p) + '</span>';
      }).join('<span class="crumb sep">›</span>')
    : '<span class="crumb big">(no location)</span>';
  $('dFields').innerHTML = DETAIL_FIELDS.map(function(f){
    var v = it[f[0]];
    if(f[0] === 'est_value' && v) v = money(v);
    return '<div class="k">' + esc(f[1]) + '</div><div class="v">' + esc(v || '—') + '</div>';
  }).join('');
  $('dNotes').textContent = it.notes || '';
  paintMisplaced(!!it.misplaced);
  $('overlay').classList.add('open');
}
function paintMisplaced(on){
  var b = $('dMisplaced');
  b.classList.toggle('on', on);
  b.innerHTML = on ? '⚑ Misplaced — tap to clear' : '⚑ Mark misplaced';
}
function closeDetail(){ $('overlay').classList.remove('open'); detailId = null; }

$('dMisplaced').addEventListener('click', async function(){
  var it = items.find(function(x){ return x.id === detailId; });
  if(!it || typeof it.id !== 'number'){ return; }  // not yet synced — toggle in main app
  var next = !it.misplaced;
  it.misplaced = next;
  paintMisplaced(next);
  persist(); renderTree(); renderLocItems(); renderFindAgain(); renderMisplaced();
  setSync('sync');
  try{
    await apiPost({action:'patch', id:it.id, fields:{misplaced:next}});
    setSync(pending.length ? 'err' : 'ok');
  }catch(e){
    pending.push({id:it.id, fields:{misplaced:next}});
    setSync('err');
  }
});
function renderFindAgain(){
  var ev = new Event('input');
  $('find').dispatchEvent(ev);
}
$('dClose').addEventListener('click', closeDetail);
$('overlay').addEventListener('click', function(e){ if(e.target === $('overlay')) closeDetail(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDetail(); });
$('inclSubs').addEventListener('change', renderLocItems);
$('syncBadge').addEventListener('click', function(){ load(); });
$('expandAll').addEventListener('click', function(){ setExpandedAll(true); });
$('collapseAll').addEventListener('click', function(){ setExpandedAll(false); });

load();
</script>
</body>
</html>
