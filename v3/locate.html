<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Locate — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@500;600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --s1:#131313; --s2:#1a1a1a; --s3:#222;
  --border:#2a2a2a; --border2:#3a3a3a;
  --text:#f2f2f2; --text-mid:#c8c8c8; --text-dim:#999;
  --rose:#b07a84; --rose-dim:rgba(176,122,132,0.14);
  --green:#4d8f6a; --amber:#9e7a32; --red:#8f4848;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-condensed:'Bebas Neue',Impact,sans-serif;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ui);font-size:14px;
  display:flex;flex-direction:column;min-height:100vh;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── HEADER ── */
.t-hdr{
  display:flex;align-items:center;gap:12px;
  padding:0 16px;height:60px;flex-shrink:0;
  border-bottom:1px solid var(--border);background:var(--bg);
  position:sticky;top:0;z-index:100;
}
.t-hdr-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
.t-home-btn{
  font-size:17px;line-height:1;color:var(--text-dim);background:none;border:1px solid var(--border2);
  border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all 0.15s;flex-shrink:0;text-decoration:none;
}
.t-home-btn:hover,.t-home-btn:active{color:var(--rose);border-color:var(--rose)}
.t-logo{font-family:var(--font-mono);font-size:13px;letter-spacing:0.18em;color:var(--text-mid);text-transform:uppercase;font-weight:500;white-space:nowrap}
.t-sync{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0;cursor:pointer}
.t-sync.ok{background:var(--green);box-shadow:0 0 5px rgba(77,143,106,0.7)}
.t-sync.sync{background:var(--amber);box-shadow:0 0 5px rgba(158,122,50,0.7)}
.t-sync.err{background:var(--red);box-shadow:0 0 5px rgba(143,72,72,0.7)}
.t-search-wrap{flex:1;position:relative;min-width:0}
.t-search{
  width:100%;background:var(--s2);border:1.5px solid var(--border2);
  border-radius:12px;padding:10px 16px;
  color:var(--text);font-family:var(--font-ui);font-size:16px;
  outline:none;-webkit-appearance:none;transition:border-color 0.15s;
}
.t-search:focus{border-color:var(--rose)}
.t-search::placeholder{color:var(--text-dim)}
.t-hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.t-burger-btn{
  font-size:17px;line-height:1;color:var(--text-dim);background:none;border:1px solid var(--border2);
  border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all 0.15s;flex-shrink:0;
}
.t-burger-btn:hover,.t-burger-btn:active{color:var(--rose);border-color:var(--rose)}

/* ── STAT STRIP ── */
.mob-stats{display:flex;padding:12px 0;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.mob-stat{flex:1;text-align:center;min-width:0}
.mob-stat-num{font-family:var(--font-mono);font-size:22px;font-weight:500;color:var(--text);white-space:nowrap}
.mob-stat-lbl{font-family:var(--font-mono);font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}

/* ── CONTENT ── */
.mob-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.mob-home-tree-row{display:flex;gap:8px;padding:12px 16px 4px}
.mob-home-tree-btn{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;
  color:var(--rose);background:none;border:1px solid var(--rose-dim);
  border-radius:8px;padding:9px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:all 0.15s;
}
.mob-home-tree-btn:hover,.mob-home-tree-btn:active{background:var(--rose-dim);border-color:var(--rose)}
.mob-home-tree-btn.plain{color:var(--text-dim);border-color:var(--border2)}
.mob-home-tree-btn.plain:hover{color:var(--text);border-color:var(--text-dim)}

/* ── LOCATION CARDS ── */
.mob-boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px 16px}
.mob-box{
  background:linear-gradient(180deg,#15181e 0%,#101217 100%);
  border:1px solid var(--border);border-top:3px solid var(--border2);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 1px 2px rgba(0,0,0,0.4),0 8px 24px -16px rgba(0,0,0,0.7);
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
  padding:16px 16px 14px;cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.mob-box:active{transform:scale(0.985);border-color:var(--border2)}
.mob-box-name{font-weight:650;letter-spacing:-0.015em;font-size:17px;margin-bottom:8px;padding-right:18px}
.mob-box-count{
  font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.04em;
  display:inline-block;background:rgba(0,0,0,0.35);border:1px solid var(--border);
  border-radius:20px;padding:3px 10px;
}
.mob-box-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:0.35;font-size:18px;color:var(--text-mid)}

/* ── DRILL-DOWN HEADER ── */
.mob-browse-hdr{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.mob-back{
  background:var(--s2);border:1px solid var(--border2);border-radius:11px;
  transition:background .12s,border-color .12s;
  color:var(--text-mid);font-family:var(--font-ui);font-size:14px;font-weight:500;
  padding:9px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;
}
.mob-back:active{background:var(--s3);color:var(--rose);border-color:var(--rose)}
.mob-btitle{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:0.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-bcount{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex-shrink:0}
.mob-bc{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 16px 0;font-family:var(--font-mono);font-size:11px}
.mob-bc button{background:none;border:none;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;cursor:pointer;padding:2px 4px}
.mob-bc button:hover{color:var(--rose)}
.mob-bc button.cur{color:var(--text)}
.mob-bc-sep{color:var(--text-dim);opacity:0.6}
.mob-sec-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
.mob-sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── FULL TREE ── */
.mob-tree-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex-shrink:0}
.mob-tree-title{font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim)}
.mob-tree-actions{display:flex;gap:8px}
.mob-tree-btn{
  font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;color:var(--text-dim);
  background:var(--s2);border:1px solid var(--border2);border-radius:7px;padding:6px 10px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.mob-tree-btn:active{color:var(--rose);border-color:var(--rose)}
.mob-tree-scroll{flex:1;padding:4px 12px 32px}
.mob-trow{display:flex;align-items:center;gap:8px;padding:9px 4px;min-height:30px;cursor:pointer;-webkit-tap-highlight-color:rgba(255,255,255,0.06);touch-action:manipulation;border-radius:6px}
.mob-trow:active{background:var(--s2)}
.mob-tree-exp{width:22px;height:22px;flex-shrink:0;background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s}
.mob-tree-exp.open{transform:rotate(90deg)}
.mob-tree-exp-spacer{width:22px;flex-shrink:0}
.mob-tree-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mob-tree-name{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-tree-cnt{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);flex-shrink:0}
.mob-tree-children{margin-left:10px;border-left:1.5px solid var(--border2);padding-left:2px}

/* ── ITEM ROWS ── */
.mob-list{background:var(--s1);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.mob-card{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--border);
  border-left:3px solid transparent;padding:11px 16px;cursor:pointer;color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
.mob-card:last-child{border-bottom:none}
.mob-card:active{background:var(--s2)}
.mob-card.misplaced{background:rgba(143,72,72,0.08);border-left-color:var(--red)}
.mob-card-name{font-weight:600;letter-spacing:-0.01em;font-size:15px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mob-card-name .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-card-loc{background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);flex-shrink:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-badge{letter-spacing:0.08em;font-family:var(--font-mono);font-size:9px;font-weight:600;border-radius:3px;padding:3px 8px;white-space:nowrap;flex-shrink:0;border:1px solid transparent}
.mob-badge.g{background:rgba(77,143,106,0.14);color:#6fae83;border-color:rgba(77,143,106,0.25)}
.mob-badge.s{background:rgba(110,143,168,0.12);color:#6e8fa8;border-color:rgba(110,143,168,0.25)}
.mob-badge.a{background:rgba(158,122,50,0.14);color:#c09a4a;border-color:rgba(158,122,50,0.25)}
.mob-badge.r{background:rgba(143,72,72,0.14);color:#c07a7a;border-color:rgba(143,72,72,0.25)}
.mob-badge.d{background:rgba(255,255,255,0.05);color:var(--text-dim);border-color:var(--border)}
.mob-cdot{width:9px;height:9px;border-radius:50%;flex:none}
.mob-flag{color:var(--red);flex:none;font-size:13px}
.mob-empty{padding:32px 16px;text-align:center;color:var(--text-dim)}
.mob-empty-icon{font-size:28px;margin-bottom:8px;color:var(--text-dim)}
.mob-empty-t{font-family:var(--font-mono);font-size:11px}

/* ── BOTTOM TAB BAR ── */
.t-tabs{
  display:flex;border-top:1px solid var(--border);
  height:72px;flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
.t-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;background:none;border:none;
  cursor:pointer;color:var(--text-dim);
  transition:color 0.15s,background 0.15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;min-width:60px;text-decoration:none;
  font-family:var(--font-ui);
}
.t-tab:active{background:var(--s2)}
.t-tab.active{color:var(--rose)}
.t-tab-icon{font-size:22px;line-height:1}
.t-tab-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase}
.t-tab.add .t-tab-icon,.t-tab.add .t-tab-lbl{color:var(--rose)}

/* ── DRAWER ── */
.mob-drawer-ov{position:fixed;inset:0;z-index:600;display:none}
.mob-drawer-ov.open{display:block}
.mob-drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,0.55)}
.mob-drawer{position:absolute;left:0;top:0;bottom:0;width:88vw;max-width:360px;background:var(--s1);border-right:1px solid var(--border2);overflow-y:auto;transform:translateX(-100%);transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);padding-bottom:env(safe-area-inset-bottom,16px)}
.mob-drawer-ov.open .mob-drawer{transform:translateX(0)}
.mob-drawer-hdr{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mob-drawer-title{font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;color:var(--text-dim);text-transform:uppercase}
.mob-drawer-x{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;font-family:var(--font-mono)}
.mob-dlink{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;color:var(--text-mid);font-family:var(--font-ui);font-size:14px;font-weight:500;text-decoration:none;background:none;border:none;width:100%;text-align:left;cursor:pointer}
.mob-dlink:active{background:var(--s2)}
.mob-dcount{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
.mob-drawer-sec{font-family:var(--font-mono);font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);padding:14px 16px 4px}

/* ── DETAIL MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-start;justify-content:center;z-index:500;padding:14px;overflow-y:auto}
.overlay.open{display:flex}
.modal{
  background:var(--s1);border:1px solid var(--border2);border-top:3px solid var(--border2);
  border-radius:14px;width:100%;max-width:560px;margin:20px 0;padding:18px;
}
.modal h2{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-0.01em}
.modal h2 .tx{overflow:hidden;text-overflow:ellipsis}
.catline{font-size:13px;margin:2px 0 0;font-weight:600}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px;align-items:center}
.crumb{font-family:var(--font-mono);font-size:11px;color:var(--text-mid);background:var(--s2);border:1px solid var(--border2);border-radius:20px;padding:5px 11px;white-space:nowrap}
.crumb.sep{background:none;border:none;padding:5px 0;color:var(--text-dim)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px;margin-bottom:6px}
.kv .k{color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding-top:2px}
.kv .v{overflow-wrap:anywhere}
.notes{margin-top:10px;font-size:14px;color:var(--text);white-space:pre-wrap}
.mrow{display:flex;gap:10px;margin-top:16px}
.btn{padding:13px 18px;border-radius:10px;border:1px solid var(--border2);background:var(--s2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-ui)}
.btn.close{flex:1}
.btn.misplaced{flex:1;border-color:var(--red);color:#c07a7a;background:none}
.btn.misplaced.on{background:var(--red);color:#fff;border-color:var(--red)}

button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

@media(min-width:768px){
  .mob-boxes{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));padding:16px 24px}
  .mob-browse-hdr,.mob-bc,.mob-sec-label{padding-left:24px;padding-right:24px}
  .mob-tree-hdr{padding-left:24px;padding-right:24px}
}
</style>
</head>
<body>

<header class="t-hdr">
  <div class="t-hdr-left">
    <a class="t-home-btn" href="index.html" title="Inventory editor" aria-label="Home">⌂</a>
    <div class="t-logo">Inventory</div>
    <div class="t-sync" id="syncDot" title="Tap to retry sync"></div>
  </div>
  <div class="t-search-wrap">
    <input class="t-search" id="mobSearch" type="search" placeholder="Search anything…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="t-hdr-right">
    <button class="t-burger-btn" id="burgerBtn" title="Menu" aria-label="Menu">☰</button>
  </div>
</header>

<div class="mob-stats" id="statStrip">
  <div class="mob-stat"><div class="mob-stat-num" id="stItems">–</div><div class="mob-stat-lbl">Items</div></div>
  <div class="mob-stat"><div class="mob-stat-num" id="stInUse">–</div><div class="mob-stat-lbl">In Use</div></div>
  <div class="mob-stat"><div class="mob-stat-num" id="stLocs">–</div><div class="mob-stat-lbl">Locations</div></div>
  <div class="mob-stat"><div class="mob-stat-num" id="stVal">–</div><div class="mob-stat-lbl">Est. Value</div></div>
</div>

<div class="mob-content" id="content">
  <!-- BROWSE HOME: cards -->
  <div id="viewHome">
    <div class="mob-home-tree-row">
      <button class="mob-home-tree-btn" id="treeViewBtn">⊞ Full Tree View</button>
      <button class="mob-home-tree-btn plain" id="misBtn">⚑ Misplaced</button>
    </div>
    <div class="mob-boxes" id="cards"></div>
  </div>

  <!-- FULL TREE -->
  <div id="viewTree" hidden>
    <div class="mob-tree-hdr">
      <div class="mob-tree-title">Full Tree</div>
      <div class="mob-tree-actions">
        <button class="mob-tree-btn" id="treeExpandAll">Expand all</button>
        <button class="mob-tree-btn" id="treeCollapseAll">Collapse all</button>
        <button class="mob-tree-btn" id="treeBackBtn">Cards</button>
      </div>
    </div>
    <div class="mob-tree-scroll" id="treeScroll"></div>
  </div>

  <!-- DRILL-DOWN -->
  <div id="viewDrill" hidden>
    <div class="mob-browse-hdr">
      <button class="mob-back" id="drillBack">← Back</button>
      <div class="mob-btitle" id="drillTitle"></div>
      <div class="mob-bcount" id="drillCount"></div>
    </div>
    <div class="mob-bc" id="drillBc"></div>
    <div id="drillCards"></div>
    <div id="drillItems"></div>
  </div>

  <!-- FIND RESULTS -->
  <div id="findWrap" hidden>
    <div class="mob-sec-label"><span>Search results</span></div>
    <div class="mob-list" id="findResults"></div>
  </div>

  <!-- MISPLACED -->
  <div id="misWrap" hidden>
    <div class="mob-sec-label"><span>Misplaced</span></div>
    <div class="mob-list" id="misResults"></div>
  </div>
</div>

<div class="t-tabs">
  <button class="t-tab active" id="tabBrowse">
    <div class="t-tab-icon">◎</div><div class="t-tab-lbl">Browse</div>
  </button>
  <button class="t-tab" id="tabFind">
    <div class="t-tab-icon">⌕</div><div class="t-tab-lbl">Find</div>
  </button>
  <button class="t-tab add" id="tabAdd">
    <div class="t-tab-icon">＋</div><div class="t-tab-lbl">Add</div>
  </button>
  <a class="t-tab" id="tabEdit" href="index.html">
    <div class="t-tab-icon">✎</div><div class="t-tab-lbl">Edit</div>
  </a>
</div>

<div class="mob-drawer-ov" id="drawerOv">
  <div class="mob-drawer-bg" id="drawerBg"></div>
  <div class="mob-drawer">
    <div class="mob-drawer-hdr">
      <span class="mob-drawer-title">Inventory</span>
      <button class="mob-drawer-x" id="drawerX">✕</button>
    </div>
    <div class="mob-drawer-sec">Navigate</div>
    <a class="mob-dlink" href="index.html"><span>Inventory Editor</span><span class="mob-dcount">→</span></a>
    <button class="mob-dlink" id="drawerTree"><span>Full Tree View</span><span class="mob-dcount">→</span></button>
    <button class="mob-dlink" id="drawerMis"><span>Misplaced</span><span class="mob-dcount" id="drawerMisCount">0</span></button>
    <button class="mob-dlink" id="drawerSync"><span>Retry Sync</span><span class="mob-dcount" id="drawerSyncState">—</span></button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" id="dModal">
    <h2><span class="mob-cdot" id="dDot"></span><span class="tx" id="dName"></span></h2>
    <div class="catline" id="dCat"></div>
    <div class="crumbs" id="dCrumbs"></div>
    <div class="kv" id="dFields"></div>
    <div class="notes" id="dNotes"></div>
    <div class="mrow">
      <button class="btn misplaced" id="dMisplaced">⚑ Misplaced</button>
      <button class="btn close" id="dClose">Close</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   DEPLOY-TIME CONFIG — the ONLY thing to change when deploying.
   Paste the Apps Script web app /exec URL between the quotes.
   ═══════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyH0hgBBMiM-D64AEC4S90T4aWDvL7BPtQGXLY50DltWIGOqHTy3Yvkgf-gegPuAWKZ/exec';

const CACHE_KEY = 'inv_v3_cache';

/* ---------- color system (shared with index.html) ---------- */
var CAT_COLORS = {
  'Clothing':'#5aa9ff','Memorabilia & Keepsakes':'#c78bff','Cables & Charging':'#ffd166',
  'Electronics':'#4dd0e1','Accessories':'#ff8a65','Personal Care & Grooming':'#80cbc4',
  'Office Supplies':'#aed581','Tools & Hardware':'#ffab40','Camera/Photo Gear':'#f06292',
  'Legal Documents':'#90a4ae','Identity Documents':'#b0bec5','Automotive':'#ef5350',
  'Financial Documents':'#66bb6a','Cleaning & Home':'#26c6da','Health & Supplements':'#ab47bc',
  'Footwear':'#8d6e63','Books & Notebooks':'#d4e157','Gym & Fitness':'#26a69a',
  'Misc':'#9e9e9e','Military':'#7cb342','Firearms & Ammo':'#ff5252','Bags & Carry':'#5c6bc0',
  'Military Documents':'#78909c','Vehicle Documents':'#ffa726','Furniture':'#a1887f'
};
function catColor(c){
  c = String(c == null ? '' : c);
  if(CAT_COLORS[c]) return CAT_COLORS[c];
  if(!c) return '#6b7280';
  var h = 0;
  for(var i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) % 360;
  return 'hsl(' + h + ',60%,62%)';
}
var LOC_COLORS = {
  'Bedroom':'#5aa9ff','Basement':'#b088ff','Hallway':'#ffd166','Tesla':'#ff6b6b',
  'Barn':'#ffa94d','SUNY Potsdam (Maxcy)':'#4dd0e1','Unassigned':'#9aa0ae',
  'Clarkson':'#7ee081','(no location)':'#6b7280'
};
function locColor(path){
  var top = String(path == null ? '' : path).split(' > ')[0] || '(no location)';
  return LOC_COLORS[top] || '#6b7280';
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function num(v){
  var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
function moneyShort(v){
  var n = num(v);
  return n >= 1000 ? '$' + (n / 1000).toFixed(1) + 'k' : '$' + Math.round(n);
}
function isTrue(v){ return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1'; }
function condBadgeClass(cond){
  return cond === 'New' ? 'g' : cond === 'Good' ? 's' : cond === 'Fair' ? 'a' : cond === 'Poor' ? 'r' : 'd';
}

/* ---------- state ---------- */
var items = [];
var pending = [];
var tree = null;
var expanded = {};        // path -> true (full tree view)
var drillPath = [];       // array of segments for drill-down
var detailId = null;
var lastSyncState = 'sync';

function setSync(state){
  lastSyncState = state;
  var dot = $('syncDot');
  dot.className = 't-sync ' + (state === 'ok' ? 'ok' : state === 'sync' ? 'sync' : 'err');
  var lbl = state === 'ok' ? 'synced' : state === 'sync' ? 'syncing…' : 'offline — tap to retry';
  dot.title = lbl;
  var ds = $('drawerSyncState');
  if(ds) ds.textContent = lbl;
}

function fetchWithTimeout(url, opts, ms){
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 20000);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal})).then(
    function(res){
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res;
    },
    function(err){ clearTimeout(timer); throw err; }
  );
}
async function apiPost(body){
  var res = await fetchWithTimeout(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)
  }, 25000);
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || 'API error');
  return j;
}
function persist(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(items)); }catch(e){}
}
async function load(){
  setSync('sync');
  var j = null;
  for(var a = 0; a < 2 && !j; a++){   // one automatic retry before falling back to cache
    try{
      var r = await fetchWithTimeout(API_URL + '?action=list', null, 20000);
      var d = await r.json();
      if(d && d.ok) j = d;
    }catch(e){ j = null; }
  }
  if(j){
    items = j.items || [];
    persist();
    setSync(pending.length ? 'err' : 'ok');
    if(pending.length) flushPending();
  }else{
    try{ items = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); }catch(_){ items = []; }
    setSync('err');
  }
  tree = buildTree(items);
  renderStats();
  renderMisplacedBtn();
  showHome();
}
async function flushPending(){
  if(!pending.length) return;
  setSync('sync');
  var q = pending.slice(); pending = [];
  for(var k = 0; k < q.length; k++){
    try{ await apiPost({action:'patch', id:q[k].id, fields:q[k].fields}); }
    catch(e){ pending.push(q[k]); }
  }
  tree = buildTree(items);
  persist();
  renderStats(); renderMisplacedBtn();
  refreshCurrentView();
  setSync(pending.length ? 'err' : 'ok');
}

/* ---------- location tree ---------- */
function buildTree(list){
  var root = {name:'', children:{}, items:[], total:0};
  list.forEach(function(it){
    var loc = String(it.location || '').trim();
    var parts = loc ? loc.split(' > ') : ['(no location)'];
    var node = root;
    node.total++;
    parts.forEach(function(p){
      if(!node.children[p]) node.children[p] = {name:p, children:{}, items:[], total:0, path:''};
      node = node.children[p];
      node.total++;
    });
    node.items.push(it);
  });
  (function walk(n, prefix){
    Object.keys(n.children).forEach(function(k){
      var c = n.children[k];
      c.path = prefix ? prefix + ' > ' + k : k;
      walk(c, c.path);
    });
  })(root, '');
  return root;
}
function findNode(pathArr){
  var node = tree, parts = pathArr;
  for(var i = 0; i < parts.length; i++){
    node = node.children[parts[i]];
    if(!node) return null;
  }
  return node;
}
function collectItems(node, includeSubs){
  var out = node.items.slice();
  if(includeSubs){
    Object.keys(node.children).forEach(function(k){
      out = out.concat(collectItems(node.children[k], true));
    });
  }
  return out;
}

/* ---------- stats ---------- */
function renderStats(){
  var inuse = 0, tot = 0;
  items.forEach(function(i){
    if(isTrue(i.in_use)) inuse++;
    tot += num(i.est_value);
  });
  var topLocs = tree ? Object.keys(tree.children).length : 0;
  $('stItems').textContent = items.length.toLocaleString('en-US');
  $('stInUse').textContent = inuse;
  $('stLocs').textContent = topLocs;
  $('stVal').textContent = moneyShort(tot);
}
function renderMisplacedBtn(){
  var n = items.filter(function(i){ return isTrue(i.misplaced); }).length;
  $('misBtn').textContent = '⚑ Misplaced' + (n ? ' (' + n + ')' : '');
  var dc = $('drawerMisCount');
  if(dc) dc.textContent = n;
}

/* ---------- views ---------- */
function showView(name){
  $('viewHome').hidden = name !== 'home';
  $('viewTree').hidden = name !== 'tree';
  $('viewDrill').hidden = name !== 'drill';
  $('findWrap').hidden = true;
  $('misWrap').hidden = true;
  $('mobSearch').value = '';
  setActiveTab('browse');
  $('content').scrollTop = 0;
}
function setActiveTab(which){
  ['Browse','Find'].forEach(function(t){
    $('tab' + t).classList.toggle('active', t.toLowerCase() === which);
  });
}
function refreshCurrentView(){
  if(!$('viewDrill').hidden) renderDrill();
  else if(!$('viewTree').hidden) renderTreeView();
  else renderHome();
}

function cardHtml(name, total, color, pathArr){
  var pid = pathArr.join('::');
  return '<div class="mob-box" style="border-top-color:' + color + '" data-pid="' + esc(pid) + '">' +
    '<div class="mob-box-arrow">›</div>' +
    '<div class="mob-box-name" style="color:' + color + '">' + esc(name) + '</div>' +
    '<div class="mob-box-count">' + total + ' item' + (total !== 1 ? 's' : '') + '</div></div>';
}
function bindCards(container){
  Array.prototype.forEach.call(container.querySelectorAll('.mob-box'), function(box){
    box.addEventListener('click', function(){
      var pid = box.getAttribute('data-pid');
      drillPath = pid ? pid.split('::') : [];
      renderDrill();
      showView('drill');
    });
  });
}

function renderHome(){
  var el = $('cards');
  if(!tree){ el.innerHTML = '<div class="mob-empty"><div class="mob-empty-icon">◎</div><div class="mob-empty-t">No locations.</div></div>'; return; }
  // root: most items first (legacy behavior)
  var sorted = Object.keys(tree.children).map(function(k){ return [k, tree.children[k]]; })
    .sort(function(a, b){ return b[1].total - a[1].total; });
  el.innerHTML = sorted.map(function(e){
    var color = locColor(e[0]);
    return cardHtml(e[0], e[1].total, color, [e[0]]);
  }).join('') || '<div class="mob-empty"><div class="mob-empty-icon">◎</div><div class="mob-empty-t">No locations.</div></div>';
  bindCards(el);
}
function showHome(){ renderHome(); showView('home'); }

function renderDrill(){
  var node = findNode(drillPath);
  if(!node){ showHome(); return; }
  var depth = drillPath.length;
  var color = locColor(drillPath[0]);
  var title = drillPath[depth - 1];
  $('drillTitle').textContent = title;
  $('drillTitle').style.color = color;
  var allItems = collectItems(node, true);
  $('drillCount').textContent = allItems.length;
  // breadcrumb
  var segs = ['All'].concat(drillPath);
  $('drillBc').innerHTML = segs.map(function(seg, i){
    var cur = i === segs.length - 1;
    var pid = segs.slice(1, i + 1).join('::');
    return (i ? '<span class="mob-bc-sep">›</span>' : '') +
      '<button class="' + (cur ? 'cur' : '') + '" data-pid="' + esc(pid) + '">' + esc(seg) + '</button>';
  }).join('');
  Array.prototype.forEach.call($('drillBc').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      var pid = b.getAttribute('data-pid');
      drillPath = pid ? pid.split('::') : [];
      if(!drillPath.length) showHome(); else renderDrill();
    });
  });
  // child cards (A–Z)
  var kids = Object.keys(node.children).sort(function(a, b){
    return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
  });
  var cardsHtml = kids.length
    ? '<div class="mob-boxes">' + kids.map(function(k){
        var c = node.children[k];
        return cardHtml(k, c.total, locColor(c.path), drillPath.concat([k]));
      }).join('') + '</div>'
    : '';
  $('drillCards').innerHTML = cardsHtml;
  bindCards($('drillCards'));
  // items directly here
  var direct = node.items.slice().sort(function(a, b){
    return String(a.name || '').localeCompare(String(b.name || ''));
  });
  $('drillItems').innerHTML = direct.length
    ? '<div class="mob-sec-label"><span>Items here</span></div><div class="mob-list">' +
      direct.map(itemRow).join('') + '</div>'
    : '';
  bindRows($('drillItems'));
}
$('drillBack').addEventListener('click', function(){
  drillPath = drillPath.slice(0, -1);
  if(!drillPath.length) showHome(); else renderDrill();
});

/* ---------- full tree view ---------- */
function renderTreeView(){
  var el = $('treeScroll');
  if(!tree){ el.innerHTML = '<div class="mob-empty"><div class="mob-empty-icon">◎</div><div class="mob-empty-t">No locations.</div></div>'; return; }
  el.innerHTML = treeHtml(tree.children, [], 0) || '<div class="mob-empty"><div class="mob-empty-icon">◎</div><div class="mob-empty-t">No locations.</div></div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-exp]'), function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var p = btn.getAttribute('data-exp');
      expanded[p] = !expanded[p];
      renderTreeView();
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-nav]'), function(row){
    row.addEventListener('click', function(){
      var p = row.getAttribute('data-nav');
      drillPath = p ? p.split('::') : [];
      renderDrill();
      showView('drill');
    });
  });
}
function treeHtml(children, path, depth){
  var html = '';
  Object.keys(children).sort(function(a, b){
    return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
  }).forEach(function(name){
    var node = children[name];
    var p = path.concat([name]);
    var pk = p.join('::');
    var hasCh = Object.keys(node.children).length > 0;
    var isExp = !!expanded[pk];
    var color = locColor(p[0]);
    html += '<div class="mob-trow" data-nav="' + esc(pk) + '" style="padding-left:' + (8 + depth * 14) + 'px">' +
      (hasCh
        ? '<button class="mob-tree-exp' + (isExp ? ' open' : '') + '" data-exp="' + esc(pk) + '">›</button>'
        : '<span class="mob-tree-exp-spacer"></span>') +
      '<span class="mob-tree-dot" style="background:' + color + '"></span>' +
      '<span class="mob-tree-name" style="color:' + color + '">' + esc(name) + '</span>' +
      '<span class="mob-tree-cnt">' + node.total + '</span></div>';
    if(hasCh && isExp) html += '<div class="mob-tree-children">' + treeHtml(node.children, p, depth + 1) + '</div>';
  });
  return html;
}
function setTreeExpandedAll(on){
  if(on){
    (function walk(n, prefix){
      Object.keys(n.children).forEach(function(k){
        var p = prefix ? prefix + '::' + k : k;
        if(Object.keys(n.children[k].children).length) expanded[p] = true;
        walk(n.children[k], p);
      });
    })(tree, '');
  }else{
    expanded = {};
  }
  renderTreeView();
}
$('treeExpandAll').addEventListener('click', function(){ setTreeExpandedAll(true); });
$('treeCollapseAll').addEventListener('click', function(){ setTreeExpandedAll(false); });
$('treeBackBtn').addEventListener('click', showHome);
$('treeViewBtn').addEventListener('click', function(){
  renderTreeView();
  showView('tree');
});

/* ---------- item rows ---------- */
function itemRow(i){
  var cc = catColor(i.category);
  var flag = isTrue(i.misplaced) ? '<span class="mob-flag" title="Misplaced">⚑</span>' : '';
  var badge = '<span class="mob-badge ' + condBadgeClass(i.condition) + '">' + esc(i.condition || '—') + '</span>';
  var leaf = String(i.location || '').split(' > ').filter(function(p){ return p; }).slice(-1)[0] || '—';
  return '<button class="mob-card' + (isTrue(i.misplaced) ? ' misplaced' : '') + '" data-id="' + esc(String(i.id)) + '"' +
    ' style="border-left-color:' + cc + '">' +
    '<span class="mob-cdot" style="background:' + cc + '"></span>' +
    '<span class="mob-card-name">' + flag + '<span class="tx">' + esc(i.name || '(unnamed)') +
    (i.qty && i.qty !== '1' ? ' <span style="color:var(--text-dim);font-weight:400">×' + esc(i.qty) + '</span>' : '') +
    '</span></span>' +
    '<span class="mob-card-loc">' + esc(leaf) + '</span>' + badge + '</button>';
}
function bindRows(container){
  Array.prototype.forEach.call(container.querySelectorAll('[data-id]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      var it = items.find(function(x){ return String(x.id) === id; });
      if(it) openDetail(it);
    });
  });
}

/* ---------- find ---------- */
var FIND_LIMIT = 60;
$('mobSearch').addEventListener('input', function(){
  var q = $('mobSearch').value.trim().toLowerCase();
  var wrap = $('findWrap'), box = $('findResults');
  if(!q){ wrap.hidden = true; box.innerHTML = ''; return; }
  var hits = items.filter(function(i){
    return [i.name, i.notes, i.sn, i.location, i.category, i.keywords].join(' ').toLowerCase().indexOf(q) !== -1;
  });
  $('viewHome').hidden = true; $('viewTree').hidden = true; $('viewDrill').hidden = true;
  $('misWrap').hidden = true;
  wrap.hidden = false;
  box.innerHTML = hits.length
    ? hits.slice(0, FIND_LIMIT).map(itemRow).join('') +
      (hits.length > FIND_LIMIT ? '<div class="mob-empty"><div class="mob-empty-t">' + (hits.length - FIND_LIMIT) + ' more… keep typing to narrow</div></div>' : '')
    : '<div class="mob-empty"><div class="mob-empty-icon">⌕</div><div class="mob-empty-t">No matches.</div></div>';
  bindRows(box);
  setActiveTab('find');
  $('content').scrollTop = 0;
});

/* ---------- misplaced ---------- */
var misOpen = false;
function renderMisplaced(){
  var box = $('misResults');
  var list = items.filter(function(i){ return isTrue(i.misplaced); }).sort(function(a, b){
    var an = String(a.name || '').toLowerCase(), bn = String(b.name || '').toLowerCase();
    return an < bn ? -1 : an > bn ? 1 : 0;
  });
  $('viewHome').hidden = true; $('viewTree').hidden = true; $('viewDrill').hidden = true;
  $('findWrap').hidden = true;
  $('misWrap').hidden = false;
  box.innerHTML = list.length
    ? list.map(itemRow).join('')
    : '<div class="mob-empty"><div class="mob-empty-icon">◎</div><div class="mob-empty-t">Nothing misplaced right now.</div></div>';
  bindRows(box);
  $('content').scrollTop = 0;
}
$('misBtn').addEventListener('click', function(){
  misOpen = true;
  renderMisplaced();
});

/* ---------- detail modal ---------- */
var DETAIL_FIELDS = [
  ['category','Category'], ['qty','Qty'], ['condition','Condition'], ['keep','Keep'],
  ['frequency','Frequency'], ['criticality','Criticality'],
  ['replaceability','Replaceability'], ['fill_level','Fill Level'],
  ['sn','Serial / Ref #'], ['doc_type','Doc Type'],
  ['year_purchased','Year Purchased'], ['last_used','Last Used'], ['est_value','Est. Value']
];
function openDetail(it){
  detailId = it.id;
  var cc = catColor(it.category);
  $('dModal').style.borderTopColor = cc;
  $('dDot').style.background = cc;
  $('dName').textContent = it.name || '(unnamed)';
  $('dCat').innerHTML = '<span style="color:' + cc + '">●</span> ' + esc(it.category || 'Uncategorized') +
    ' &nbsp;<span class="mob-badge ' + condBadgeClass(it.condition) + '">' + esc(it.condition || '—') + '</span>';
  var parts = String(it.location || '').split(' > ').filter(function(p){ return p; });
  $('dCrumbs').innerHTML = parts.length
    ? parts.map(function(p){
        return '<span class="crumb" style="border-color:' + locColor(it.location) + '66">' + esc(p) + '</span>';
      }).join('<span class="crumb sep">›</span>')
    : '<span class="crumb">(no location)</span>';
  $('dFields').innerHTML = DETAIL_FIELDS.map(function(f){
    var v = it[f[0]];
    if(f[0] === 'est_value' && num(v)) v = '$' + num(v).toLocaleString('en-US');
    return '<div class="k">' + esc(f[1]) + '</div><div class="v">' + esc(v || '—') + '</div>';
  }).join('');
  $('dNotes').textContent = it.notes || '';
  paintMisplaced(isTrue(it.misplaced));
  $('overlay').classList.add('open');
}
function paintMisplaced(on){
  var b = $('dMisplaced');
  b.classList.toggle('on', on);
  b.textContent = on ? '⚑ Misplaced — tap to clear' : '⚑ Mark misplaced';
}
function closeDetail(){ $('overlay').classList.remove('open'); detailId = null; }

$('dMisplaced').addEventListener('click', async function(){
  var it = items.find(function(x){ return x.id === detailId; });
  if(!it || typeof it.id !== 'number'){ return; }  // not yet synced — toggle in the editor page
  var next = !isTrue(it.misplaced);
  it.misplaced = next;
  paintMisplaced(next);
  persist();
  renderMisplacedBtn();
  refreshCurrentView();
  setSync('sync');
  try{
    await apiPost({action:'patch', id:it.id, fields:{misplaced:next}});
    setSync(pending.length ? 'err' : 'ok');
  }catch(e){
    pending.push({id:it.id, fields:{misplaced:next}});
    setSync('err');
  }
});
$('dClose').addEventListener('click', closeDetail);
$('overlay').addEventListener('click', function(e){ if(e.target === $('overlay')) closeDetail(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeDetail(); closeDrawer(); } });

/* ---------- drawer ---------- */
function openDrawer(){ $('drawerOv').classList.add('open'); }
function closeDrawer(){ $('drawerOv').classList.remove('open'); }
$('burgerBtn').addEventListener('click', openDrawer);
$('drawerX').addEventListener('click', closeDrawer);
$('drawerBg').addEventListener('click', closeDrawer);
$('drawerTree').addEventListener('click', function(){
  closeDrawer();
  renderTreeView();
  showView('tree');
});
$('drawerMis').addEventListener('click', function(){
  closeDrawer();
  renderMisplaced();
});
$('drawerSync').addEventListener('click', function(){
  closeDrawer();
  load();
});

/* ---------- tab bar ---------- */
$('tabBrowse').addEventListener('click', function(){
  drillPath = [];
  showHome();
});
$('tabFind').addEventListener('click', function(){
  var s = $('mobSearch');
  s.focus();
  s.scrollIntoView({behavior:'smooth', block:'center'});
});
$('tabAdd').addEventListener('click', function(){
  location.href = 'index.html?add=1';
});
$('syncDot').addEventListener('click', function(){ load(); });

load();
</script>
</body>
</html>
